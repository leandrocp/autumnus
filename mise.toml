pnpm --filter @lumis-sh/rehype-lumis lint
pnpm --filter @lumis-sh/react lint
pnpm --filter @lumis-sh/themes lint
echo ""
echo "Running benchmark checks through mise..."
mise run -C benchmarks lint
echo ""
echo "Running Lua fmt check..."
mise run fmt-lua -- --check
'''

