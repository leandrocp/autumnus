[tasks.'test-conformance-browser']
description = "Run JavaScript conformance tests in Chromium, Firefox, and WebKit"
run = '''
#!/usr/bin/env bash
set -euo pipefail
pnpm --filter @lumis-sh/lumis build:generate
args=(install chromium firefox webkit)
if [[ "${CI:-}" == "true" ]]; then
    args=(install --with-deps chromium firefox webkit)
fi
packages/javascript/lumis/node_modules/.bin/playwright "${args[@]}"
pnpm --filter @lumis-sh/lumis test:conformance:browser
'''

