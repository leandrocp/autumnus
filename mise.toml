[tasks.'themes-gen']
description = "Generate theme JSON files from Neovim colorschemes"
usage = '''
arg "[theme_name]"
'''
run = '''
#!/usr/bin/env bash
set -euo pipefail
if [ -z "${usage_theme_name:-}" ]; then
    echo "This will regenerate all theme files in themes/"
    read -p "Do you want to proceed? (y/N) " reply
    [[ "$reply" =~ ^[Yy]$ ]] || { echo "Operation cancelled."; exit 0; }
    find themes -type f -name '*.json' -delete
    for name in $(cargo run --manifest-path crates/dev/Cargo.toml -- list-themes); do
        printf '\nGenerating %s...\n' "$name"
        nvim --clean --headless -V3 -u themes/init.lua -l themes/extract_theme.lua "$name"
    done
else
    echo "This will regenerate ${usage_theme_name:-} in themes/"
    read -p "Do you want to proceed? (y/N) " reply
    [[ "$reply" =~ ^[Yy]$ ]] || { echo "Operation cancelled."; exit 0; }
    nvim --clean --headless -V3 -u themes/init.lua -l themes/extract_theme.lua ${usage_theme_name:-}
fi
cargo run --manifest-path crates/dev/Cargo.toml -- sync-themes
pnpm --filter @lumis-sh/themes build:themes
pnpm --filter @lumis-sh/themes build:assets
'''

