[tasks.'test-javascript']
description = "Run the JavaScript test suites on both the native and Wasm runtimes"
depends = ["stage-test-parsers"]
run = '''
#!/usr/bin/env bash
set -euo pipefail
pnpm --filter @lumis-sh/lumis run build:native
pnpm --filter @lumis-sh/lumis run build

# Each process gets its own copy of the staged store, so a suite that writes
# into it cannot disturb the shared tree or another suite. The resolver
# precedence tests deliberately start from an empty store instead.
seeded_store() {
    local dir
    dir="$(mktemp -d)"
    cp -R "$PWD/target/test-parsers/parsers" "$dir/"
    echo "$dir"
}
native_runtime_data_dir="$(seeded_store)"
native_suite_data_dir="$(mktemp -d)"
wasm_suite_data_dir="$(seeded_store)"
downstream_data_dir="$(seeded_store)"
trap 'rm -rf "$native_runtime_data_dir" "$native_suite_data_dir" "$wasm_suite_data_dir" "$downstream_data_dir"' EXIT
LUMIS_TEST_RUNTIME=native \
    LUMIS_DATA_DIR="$native_runtime_data_dir" \
    pnpm --filter @lumis-sh/lumis exec vitest run test/native-runtime.test.ts
LUMIS_TEST_RUNTIME=native \
    LUMIS_DATA_DIR="$native_suite_data_dir" \
    pnpm --filter @lumis-sh/lumis exec vitest run \
        --exclude test/conformance.test.ts \
        --exclude test/query-compile.test.ts \
        --exclude 'test/browser/**' \
        --exclude test/native-runtime.test.ts

# The whole package suite under web-tree-sitter. vite.config.mjs defaults to
# `wasm`, but keep the selection explicit so this gate cannot silently duplicate
# the native run.
LUMIS_TEST_RUNTIME=wasm \
    LUMIS_DATA_DIR="$wasm_suite_data_dir" \
    pnpm --filter @lumis-sh/lumis run test

# Downstream packages use the default Node runtime, which resolves parsers in
# Rust against the store rather than through a JavaScript resolver.
LUMIS_DATA_DIR="$downstream_data_dir" pnpm -r --if-present --filter '!@lumis-sh/lumis' test
'''

[tasks.'test-queries']
description = "Compile every processed query against a parser built from languages.toml"
run = '''
#!/usr/bin/env bash
set -euo pipefail

# Query validation must not depend on what is published to npm. Building every
# parser from the pinned revisions gives complete, publication-independent
# coverage, which empties the waiver in
# packages/javascript/lumis/test/unverified-parsers.json.
echo "Checking regex portability across the whole corpus..."
cargo test -p lumis-build --test processed_queries
pnpm --filter @lumis-sh/lumis exec vitest run test/query-patterns.test.ts
echo ""

# Every parser, from the revision languages.toml pins, which is what CI checks
# the queries against. A parser already in tmp/wasm/build is left alone, so a
# second run is quick; rm -rf tmp/wasm/build to rebuild from scratch.
echo "Building every parser from languages.toml..."
# Run node directly: `pnpm exec` writes its unsupported-platform warnings for
# the optional native packages to stdout, which would land in this list.
(cd packages/javascript/lumis && node scripts/list-parsers.mjs --parsers) > /tmp/lumis-parsers.txt
while read -r parser; do
    [ -n "$parser" ] || continue
    [ -f "tmp/wasm/build/$parser.wasm" ] && continue
    [ -f "fixtures/parsers/$parser.wasm" ] && continue
    mise run wasm-build "$parser"
done < /tmp/lumis-parsers.txt
echo ""

echo "Compiling every query against its pinned grammar..."
LUMIS_QUERY_COVERAGE=complete pnpm --filter @lumis-sh/lumis run test:queries
'''

