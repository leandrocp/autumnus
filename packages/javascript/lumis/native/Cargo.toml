[package]
name = "lumis-js-native"
version = "0.5.2"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
authors.workspace = true
description = "Native Node.js runtime for @lumis-sh/lumis"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
lumis-wasm-runtime = { path = "../../../../crates/lumis-wasm-runtime" }
lumis-core = { path = "../../../../crates/lumis-core", version = "2", features = ["all-languages"] }
napi = { version = "3", default-features = false, features = ["napi8"] }
napi-derive = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
napi-build = "2"
