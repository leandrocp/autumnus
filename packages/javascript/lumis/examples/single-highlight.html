<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Single highlight() call</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
    pre.lumis { padding: 1rem; border-radius: 0.5rem; overflow-x: auto; }
  </style>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100 antialiased">
  <main class="mx-auto flex max-w-7xl flex-col gap-6 px-6 py-6 lg:px-8">
    <nav class="flex items-center justify-between rounded-2xl border border-cyan-400/20 bg-slate-950/70 px-4 py-3 shadow-[0_20px_50px_rgba(2,6,23,0.45)] backdrop-blur">
      <a class="text-sm font-medium text-slate-200 transition-colors hover:text-white" href="/">All examples</a>
      <span class="rounded-full border border-cyan-400/30 bg-cyan-400/10 px-3 py-1 text-[11px] uppercase tracking-[0.25em] text-cyan-300">Quick start</span>
    </nav>
    <section class="rounded-[28px] border border-slate-800 bg-slate-950/70 p-6 shadow-[0_20px_50px_rgba(2,6,23,0.45)] backdrop-blur md:p-8">
      <p class="mb-3 text-[11px] uppercase tracking-[0.3em] text-cyan-300">Stateless API</p>
      <h1 class="text-2xl font-semibold text-white mb-2">Single highlight() call</h1>
      <p class="text-slate-400 mb-6">Stateless shorthand — no setup, just pass a bundle and theme directly.</p>
      <div id="output"></div>
    </section>
  </main>

  <script type="module">
    import { highlight } from '../src/index.browser.ts'
    import { htmlInline } from '../src/formatters.ts'
    import rust from '../langs/rust.ts'
    import tokyonightMoon from '@lumis-sh/themes/tokyonight_moon'

    document.getElementById('output').innerHTML = await highlight(
      `fn main() {
    let name = "world";
    println!("Hello, {}!", name);
}`,
      htmlInline({ language: rust, theme: tokyonightMoon })
    )
  </script>
</body>
</html>
