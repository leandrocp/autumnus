<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>htmlInline options</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-900 text-slate-300 min-h-screen">
  <div class="max-w-2xl mx-auto py-12 px-4">
    <h1 class="text-2xl font-semibold text-white mb-2">htmlInline options</h1>
    <p class="text-slate-400 mb-6">Customize the HTML output with different formatter options.</p>
    <div id="error" class="hidden text-sm px-3 py-2 rounded mb-6 bg-red-900/40 text-red-300"></div>

    <h2 class="text-lg font-medium text-blue-400 mt-8 mb-3">Default</h2>
    <div id="default-output"></div>

    <h2 class="text-lg font-medium text-blue-400 mt-8 mb-3">Custom preClass</h2>
    <div id="preclass-output"></div>

    <h2 class="text-lg font-medium text-blue-400 mt-8 mb-3">Italic enabled</h2>
    <div id="italic-output"></div>

    <h2 class="text-lg font-medium text-blue-400 mt-8 mb-3">Header (file badge)</h2>
    <div id="header-output"></div>

    <h2 class="text-lg font-medium text-blue-400 mt-8 mb-3">includeHighlights (data attributes)</h2>
    <div id="highlights-output"></div>
  </div>

  <script type="module">
    import { createHighlighter, htmlInline } from '../src/index.ts'
    import javascript from '../langs/javascript.ts'
    import tokyonight_moon from '../themes/tokyonight_moon.ts'

    const code = `function add(a, b) {\n  return a + b\n}`

    try {
      const hl = await createHighlighter({
        langs: [javascript],
        themes: [tokyonight_moon],
      })

      document.getElementById('default-output').innerHTML = hl.highlight(
        code,
        htmlInline({ lang: 'javascript', theme: 'tokyonight_moon' })
      )

      document.getElementById('preclass-output').innerHTML = hl.highlight(
        code,
        htmlInline({ lang: 'javascript', theme: 'tokyonight_moon', preClass: 'my-code lumis' })
      )

      document.getElementById('italic-output').innerHTML = hl.highlight(
        code,
        htmlInline({ lang: 'javascript', theme: 'tokyonight_moon', italic: true })
      )

      document.getElementById('header-output').innerHTML = hl.highlight(
        code,
        htmlInline({
          lang: 'javascript',
          theme: 'tokyonight_moon',
          header: {
            openTag: '<div class="rounded-lg overflow-hidden"><div class="flex items-center justify-between px-4 py-2 bg-slate-800 border-b border-slate-700"><span class="text-xs font-semibold text-blue-400 uppercase tracking-wide">JavaScript</span><span class="text-sm text-slate-500 font-mono">math.js</span></div>',
            closeTag: '</div>',
          },
        })
      )

      document.getElementById('highlights-output').innerHTML = hl.highlight(
        code,
        htmlInline({ lang: 'javascript', theme: 'tokyonight_moon', includeHighlights: true })
      )
    } catch (err) {
      const el = document.getElementById('error')
      el.textContent = `Error: ${err.message}`
      el.classList.remove('hidden')
      console.error(err)
    }
  </script>
</body>
</html>
