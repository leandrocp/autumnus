<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>createHighlighter</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-900 text-slate-300 min-h-screen">
  <div class="max-w-2xl mx-auto py-12 px-4">
    <h1 class="text-2xl font-semibold text-white mb-2">createHighlighter</h1>
    <p class="text-slate-400 mb-6">Pre-load languages and themes, then highlight synchronously.</p>
    <div id="error" class="hidden text-sm px-3 py-2 rounded mb-6 bg-red-900/40 text-red-300"></div>
    <div id="output" class="space-y-4"></div>
  </div>

  <script type="module">
    import { createHighlighter, htmlInline } from '../src/index.ts'
    import javascript from '../langs/javascript.ts'
    import rust from '../langs/rust.ts'
    import tokyonight_moon from '../themes/tokyonight_moon.ts'

    try {
      const hl = await createHighlighter({
        langs: [javascript, rust],
        themes: [tokyonight_moon],
      })

      document.getElementById('output').innerHTML =
        hl.highlight(
          `function greet(name) {\n  return "Hello, " + name\n}`,
          htmlInline({ lang: 'javascript', theme: 'tokyonight_moon' })
        ) +
        hl.highlight(
          `fn main() {\n    println!("Hello, Lumis!");\n}`,
          htmlInline({ lang: 'rust', theme: 'tokyonight_moon' })
        )
    } catch (err) {
      const el = document.getElementById('error')
      el.textContent = `Error: ${err.message}`
      el.classList.remove('hidden')
      console.error(err)
    }
  </script>
</body>
</html>
