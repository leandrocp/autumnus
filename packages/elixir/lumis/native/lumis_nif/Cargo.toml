[package]
name = "lumis_nif"
version = "0.1.0"
edition = "2021"
rust-version = "1.91"
publish = false

[lib]
name = "lumis_nif"
path = "src/lib.rs"
crate-type = ["cdylib"]

[dependencies]
anyhow = "1"
once_cell = "1.21"
parking_lot = "0.12"
rustler = "0.38"
# Until lumis-core 2.5 and lumis-wasm-runtime 0.2.1 are published, both are
# taken from this branch. Swap back to version requirements before merging.
lumis-core = { git = "https://github.com/leandrocp/lumis", branch = "refactor/share-wasm-runtime", default-features = false, features = ["all-languages", "rustler"] }
lumis-wasm-runtime = { git = "https://github.com/leandrocp/lumis", branch = "refactor/share-wasm-runtime" }

[features]
default = ["nif_version_2_15"]
nif_version_2_15 = ["rustler/nif_version_2_15"]
