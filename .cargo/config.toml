# Grammar crates generated with tree-sitter CLI < 0.26.4 ship an array.h whose
# macros violate strict aliasing, which gcc -O2 miscompiles into heap
# corruption (tree-sitter/tree-sitter@ed6e42c, tree-sitter/tree-sitter-haskell#144).
# Compile all C without strict aliasing on every gcc/clang target so no
# toolchain change can surface it. MSVC does no type-based aliasing analysis
# and does not accept the flag.
[env]
CFLAGS_aarch64_apple_darwin = "-fno-strict-aliasing"
CFLAGS_aarch64_unknown_linux_gnu = "-fno-strict-aliasing"
CFLAGS_aarch64_unknown_linux_musl = "-fno-strict-aliasing"
CFLAGS_arm_unknown_linux_gnueabihf = "-fno-strict-aliasing"
CFLAGS_riscv64gc_unknown_linux_gnu = "-fno-strict-aliasing"
CFLAGS_x86_64_apple_darwin = "-fno-strict-aliasing"
CFLAGS_x86_64_pc_windows_gnu = "-fno-strict-aliasing"
CFLAGS_x86_64_unknown_freebsd = "-fno-strict-aliasing"
CFLAGS_x86_64_unknown_linux_gnu = "-fno-strict-aliasing"
CFLAGS_x86_64_unknown_linux_musl = "-fno-strict-aliasing"
