[workspace]

[package]
name = "lumis-benchmarks"
version = "0.0.0"
edition = "2021"
rust-version = "1.91"
publish = false

[dependencies]
lumis = { path = "../../crates/lumis", default-features = false, features = ["lang-c", "lang-css", "lang-go", "lang-html", "lang-java", "lang-javascript", "lang-json", "lang-python", "lang-ruby", "lang-rust"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
syntect = "5.3"

[dev-dependencies]
criterion = { version = "0.7", features = ["html_reports"] }

[[bench]]
name = "scenarios"
harness = false

[profile.release]
lto = true
codegen-units = 1
strip = true

[profile.bench]
lto = true
codegen-units = 1
