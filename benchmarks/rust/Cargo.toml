[workspace]

[package]
name = "lumis-benchmarks"
version = "0.0.0"
edition = "2021"
rust-version = "1.91"
publish = false

[dependencies]
lumis = { path = "../../crates/lumis", version = "0.12", default-features = false, features = ["lang-bash", "lang-c", "lang-comment", "lang-elixir", "lang-heex", "lang-markdown", "lang-markdown-inline", "lang-css", "lang-go", "lang-html", "lang-java", "lang-javascript", "lang-json", "lang-python", "lang-ruby", "lang-rust", "lang-tsx"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
syntect = "5.3"
two-face = "0.5.1"

[dev-dependencies]
criterion = { version = "0.7", features = ["html_reports"] }

[[bench]]
name = "scenarios"
harness = false

[[bin]]
name = "lumis-size"
path = "src/bin/lumis-size.rs"

[[bin]]
name = "syntect-size"
path = "src/bin/syntect-size.rs"

[[bin]]
name = "showcase"
path = "src/bin/showcase.rs"

[profile.release]
lto = true
codegen-units = 1
strip = true

[profile.bench]
lto = true
codegen-units = 1
