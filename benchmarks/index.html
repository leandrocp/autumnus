<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lumis visual output comparison</title>
    <style>
      :root {
        color-scheme: dark;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #101116;
        color: #f8f8f2;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        height: 100vh;
        display: grid;
        grid-template-rows: auto auto minmax(0, 1fr);
        overflow: hidden;
      }
      header {
        padding: 28px clamp(18px, 4vw, 56px) 22px;
        border-bottom: 1px solid #343644;
        background: #171821;
      }
      h1 {
        margin: 0 0 8px;
        font-size: clamp(24px, 4vw, 38px);
        letter-spacing: -0.03em;
      }
      p {
        margin: 0;
        color: #b8b9c7;
      }
      a {
        color: #bd93f9;
      }
      code {
        color: #8be9fd;
      }
      nav {
        display: flex;
        gap: 8px;
        padding: 14px clamp(18px, 4vw, 56px);
        overflow-x: auto;
        border-bottom: 1px solid #343644;
      }
      button {
        flex: 0 0 auto;
        padding: 9px 13px;
        border: 1px solid #44475a;
        border-radius: 999px;
        background: #21222c;
        color: #f8f8f2;
        font: inherit;
        cursor: pointer;
      }
      button:hover,
      button[aria-selected="true"] {
        border-color: #bd93f9;
        background: #443657;
      }
      main {
        min-height: 0;
      }
      iframe {
        display: block;
        width: 100%;
        height: 100%;
        border: 0;
        background: #171821;
      }
      .notice {
        margin-top: 12px;
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Visual output comparison</h1>
      <p id="fixture"></p>
      <p class="notice">
        Generate once with <code>mise run -C benchmarks showcase</code>, then open this file
        directly.
      </p>
    </header>
    <nav aria-label="Implementation"></nav>
    <main>
      <iframe title="Highlighted output" loading="eager"></iframe>
    </main>
    <script src="showcase/generated/manifest.js"></script>
    <script>
      const { fixture, implementations, theme } = globalThis.LUMIS_BENCHMARK_SHOWCASE;
      const fixtureSummary = document.querySelector("#fixture");
      fixtureSummary.append(
        `${theme.name} · HTML + ${fixture.injections.join(" + ")} · ${fixture.lines.toLocaleString()} lines · `,
      );
      const sourceLink = document.createElement("a");
      sourceLink.href = fixture.source;
      sourceLink.target = "_blank";
      sourceLink.rel = "noreferrer";
      sourceLink.textContent = "Original source";
      fixtureSummary.append(sourceLink, ".");

      const navigation = document.querySelector("nav");
      const frame = document.querySelector("iframe");
      for (const [index, implementation] of implementations.entries()) {
        const button = document.createElement("button");
        button.dataset.page = implementation.id;
        button.textContent = implementation.label;
        button.setAttribute("aria-selected", String(index === 0));
        button.addEventListener("click", () => {
          for (const candidate of navigation.children) {
            candidate.setAttribute("aria-selected", String(candidate === button));
          }
          frame.src = `showcase/generated/${button.dataset.page}.html`;
          frame.title = `${button.textContent} highlighted output`;
        });
        navigation.append(button);
      }
      navigation.firstElementChild.click();
    </script>
  </body>
</html>
