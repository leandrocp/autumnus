<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lumis visual output comparison</title>
    <style>
      :root {
        color-scheme: dark;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #101116;
        color: #f8f8f2;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        height: 100vh;
        display: grid;
        grid-template-rows: auto auto minmax(0, 1fr);
        overflow: hidden;
      }
      header {
        padding: 28px clamp(18px, 4vw, 56px) 22px;
        border-bottom: 1px solid #343644;
        background: #171821;
      }
      h1 {
        margin: 0 0 8px;
        font-size: clamp(24px, 4vw, 38px);
        letter-spacing: -0.03em;
      }
      p {
        margin: 0;
        color: #b8b9c7;
      }
      a {
        color: #bd93f9;
      }
      code {
        color: #8be9fd;
      }
      nav {
        display: flex;
        gap: 8px;
        padding: 14px clamp(18px, 4vw, 56px);
        overflow-x: auto;
        border-bottom: 1px solid #343644;
      }
      button {
        flex: 0 0 auto;
        padding: 9px 13px;
        border: 1px solid #44475a;
        border-radius: 999px;
        background: #21222c;
        color: #f8f8f2;
        font: inherit;
        cursor: pointer;
      }
      button:hover,
      button[aria-selected="true"] {
        border-color: #bd93f9;
        background: #443657;
      }
      main {
        min-height: 0;
      }
      iframe {
        display: block;
        width: 100%;
        height: 100%;
        border: 0;
        background: #171821;
      }
      .notice {
        margin-top: 12px;
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Visual output comparison</h1>
      <p>
        Dracula · HTML + CSS + JSON + JavaScript · 1,397 lines ·
        <a
          href="https://github.com/mrdoob/three.js/blob/6365c1a0af6a32ed45f99712197555fee2f4b24a/examples/webgpu_compute_reduce.html"
          target="_blank"
          rel="noreferrer"
          >Original source</a
        >.
      </p>
      <p class="notice">
        Generate once with <code>mise run -C benchmarks showcase</code>, then open this file
        directly.
      </p>
    </header>
    <nav aria-label="Implementation">
      <button data-page="lumis-rust" aria-selected="true">Lumis Rust</button>
      <button data-page="lumis-javascript">Lumis JavaScript WASM</button>
      <button data-page="lumis-elixir">Lumis Elixir</button>
      <button data-page="lumis-cli">Lumis CLI</button>
      <button data-page="shiki">Shiki 4.3.1</button>
      <button data-page="highlight-js">highlight.js 11.11.1</button>
      <button data-page="syntect">syntect 5.3.0</button>
      <button data-page="bat">bat 0.26.1</button>
    </nav>
    <main>
      <iframe
        title="Highlighted output"
        src="showcase/generated/lumis-rust.html"
        loading="eager"
      ></iframe>
    </main>
    <script>
      const frame = document.querySelector("iframe");
      for (const button of document.querySelectorAll("button[data-page]")) {
        button.addEventListener("click", () => {
          for (const candidate of document.querySelectorAll("button[data-page]")) {
            candidate.setAttribute("aria-selected", String(candidate === button));
          }
          frame.src = `showcase/generated/${button.dataset.page}.html`;
          frame.title = `${button.textContent} highlighted output`;
        });
      }
    </script>
  </body>
</html>
