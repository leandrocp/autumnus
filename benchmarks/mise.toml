min_version = "2026.7.3"

[tools]
node = "24.18.0"
pnpm = "11.15.1"
rust = { version = "1.91.1", components = ["rustfmt", "clippy"] }
erlang = "28.5"
elixir = "1.19.5-otp-28"
hyperfine = "1.20.0"
bat = "0.26.1"

[env]
BENCH_RUN_DIR = "{{ config_root }}/../target/benchmarks/runs/current"
CARGO_TARGET_DIR = "{{ config_root }}/../target/benchmarks/rust-target"
MIX_INSTALL_DIR = "{{ config_root }}/../target/benchmarks/elixir-install"

[task_config]
dir = "{{ config_root }}/.."

[tasks.install]
description = "Install locked benchmark dependencies"
env = { CI = "true" }
run = "pnpm install --frozen-lockfile"
sources = ["pnpm-lock.yaml", "pnpm-workspace.yaml", "benchmarks/javascript/package.json"]
outputs = ["node_modules/.pnpm/lock.yaml"]

[tasks.fixtures]
description = "Generate and verify the four benchmark scenarios"
run = "node benchmarks/scripts/verify-fixtures.mjs"
sources = [
  "benchmarks/fixtures/**/*",
  "benchmarks/scripts/generate-fixtures.mjs",
  "benchmarks/scripts/verify-fixtures.mjs",
]
outputs = ["target/benchmarks/fixtures/scenarios.json"]

[tasks."build:themes"]
description = "Build the theme consumed by JavaScript benchmarks"
depends = ["install"]
run = "pnpm --filter @lumis-sh/themes build"
sources = [
  "packages/javascript/themes/package.json",
  "packages/javascript/themes/src/**/*",
  "packages/javascript/themes/scripts/**/*",
  "packages/javascript/themes/themes/**/*",
  "themes/*.json",
]
outputs = ["packages/javascript/themes/dist/index.js"]

[tasks."build:javascript"]
description = "Build the JavaScript Wasm runtime"
depends = ["install", "build:themes", "fixtures"]
run = "pnpm --filter @lumis-sh/lumis build"
sources = [
  "Cargo.toml",
  "Cargo.lock",
  "languages.toml",
  "packages/javascript/lumis/package.json",
  "packages/javascript/lumis/src/**/*",
  "packages/javascript/lumis/scripts/**/*",
  "crates/lumis/src/**/*.rs",
  "crates/lumis/Cargo.toml",
  "crates/lumis/build.rs",
  "crates/lumis-core/src/**/*.rs",
  "crates/lumis-core/Cargo.toml",
  "crates/lumis-wasm-runtime/src/**/*.rs",
  "crates/lumis-wasm-runtime/Cargo.toml",
  "packages/javascript/lumis/langs/*.ts",
  "queries/processed/**/*.scm",
]
outputs = ["packages/javascript/lumis/dist/index.js"]

[tasks."build:rust"]
description = "Build the Criterion scenario benchmark"
depends = ["fixtures"]
run = "cargo bench --manifest-path benchmarks/rust/Cargo.toml --bench scenarios --no-run"
sources = [
  "benchmarks/rust/Cargo.toml",
  "benchmarks/rust/Cargo.lock",
  "benchmarks/rust/benches/scenarios.rs",
]

[tasks."build:rust-sizes"]
description = "Build the stripped Rust package-size executables"
run = "cargo build --manifest-path benchmarks/rust/Cargo.toml --release --bins"
sources = [
  "benchmarks/rust/Cargo.toml",
  "benchmarks/rust/Cargo.lock",
  "benchmarks/rust/src/bin/*.rs",
]
outputs = [
  "target/benchmarks/rust-target/release/lumis-size",
  "target/benchmarks/rust-target/release/syntect-size",
]

[tasks."build:cli"]
description = "Build the local Lumis CLI"
run = "cargo build --locked --release -p lumis-cli"
sources = [
  "Cargo.toml",
  "Cargo.lock",
  "crates/lumis-cli/**/*",
  "crates/lumis-core/**/*",
  "crates/lumis-wasm-runtime/**/*",
]
outputs = ["target/benchmarks/rust-target/release/lumis"]

[tasks."build:elixir"]
description = "Build the local Elixir package and install Benchee dependencies"
run = "MIX_ENV=prod BENCH_INSTALL_ONLY=1 elixir benchmarks/elixir/scenario.exs"
sources = [
  "benchmarks/elixir/mix.lock",
  "benchmarks/elixir/scenario.exs",
  "packages/elixir/lumis/lib/**/*.ex",
  "packages/elixir/lumis/native/lumis_nif/Cargo.toml",
  "packages/elixir/lumis/native/lumis_nif/src/**/*.rs",
]
outputs = ["target/benchmarks/elixir-install"]

[tasks."prepare:cli"]
description = "Prepare and validate the offline CLI parser cache"
depends = ["install", "fixtures", "build:cli"]
run = "node benchmarks/scripts/prepare-cli.mjs"

[tasks.build]
description = "Build every benchmark implementation"
depends = [
  "build:javascript",
  "build:rust",
  "build:rust-sizes",
  "build:elixir",
  "prepare:cli",
]

[tasks.setup]
description = "Install and build the benchmark suite"
depends = ["install", "build"]

[tasks.format]
description = "Format benchmark code"
depends = ["install"]
run = '''
cargo fmt --manifest-path benchmarks/rust/Cargo.toml
pnpm --filter @lumis-sh/benchmarks fmt
mix format benchmarks/elixir/scenario.exs
'''

[tasks."format:check"]
description = "Check benchmark formatting"
depends = ["install"]
run = '''
cargo fmt --manifest-path benchmarks/rust/Cargo.toml -- --check
pnpm --filter @lumis-sh/benchmarks fmt:check
mix format --check-formatted benchmarks/elixir/scenario.exs
'''

[tasks.lint]
description = "Lint benchmark code"
depends = ["format:check"]
run = '''
cargo clippy --manifest-path benchmarks/rust/Cargo.toml --all-targets -- -D warnings
pnpm --filter @lumis-sh/benchmarks lint
'''

[tasks.check]
description = "Verify fixtures, formatting, lint, and optimized builds"
depends = ["build", "lint"]

[tasks.rust]
description = "Run Criterion for Lumis Rust and syntect"
depends = ["build:rust", "fixtures"]
run = '''
rm -rf "$CARGO_TARGET_DIR/criterion" "$BENCH_RUN_DIR/criterion"
mkdir -p "$BENCH_RUN_DIR"
BENCH_METADATA_DIR="$BENCH_RUN_DIR" cargo bench --manifest-path benchmarks/rust/Cargo.toml --bench scenarios -- --noplot
cp -R "$CARGO_TARGET_DIR/criterion" "$BENCH_RUN_DIR/criterion"
'''

[tasks.javascript]
description = "Run Mitata for Lumis JS Wasm and Shiki"
depends = ["build:javascript", "fixtures"]
run = '''
for implementation in lumis-js-wasm shiki; do
  for scenario in small-one-language large-one-language ten-files-one-language ten-files-ten-languages; do
    output="$BENCH_RUN_DIR/javascript/$implementation/$scenario.json"
    BENCH_IMPLEMENTATION="$implementation" BENCH_SCENARIO="$scenario" BENCH_OUTPUT="$output" pnpm --filter @lumis-sh/benchmarks benchmark
  done
done
'''

[tasks.elixir]
description = "Run Benchee for Lumis Elixir"
depends = ["build:elixir", "fixtures"]
run = '''
mkdir -p "$BENCH_RUN_DIR/elixir"
for scenario in small-one-language large-one-language ten-files-one-language ten-files-ten-languages; do
  MIX_ENV=prod BENCH_SCENARIO="$scenario" BENCH_OUTPUT="$BENCH_RUN_DIR/elixir/$scenario.json" BENCH_METADATA_OUTPUT="$BENCH_RUN_DIR/elixir/$scenario-metadata.json" elixir benchmarks/elixir/scenario.exs
done
'''

[tasks.cli]
description = "Run Hyperfine for Lumis CLI and bat"
depends = ["prepare:cli", "fixtures"]
run = '''
cli_root="$MISE_CONFIG_ROOT/../target/benchmarks/cli"
mkdir -p "$BENCH_RUN_DIR/cli"
cp "$cli_root/metadata.json" "$BENCH_RUN_DIR/cli/metadata.json"
export XDG_CACHE_HOME="$cli_root/xdg-cache"
export LUMIS_DATA_DIR="$cli_root/data"
export LUMIS_CONFIG="$cli_root/missing-config.toml"
export BAT_OPTS=""
export BAT_PAGER="cat"
export PAGER="cat"
export CLICOLOR_FORCE="1"
unset NO_COLOR
for scenario in small-one-language large-one-language ten-files-one-language ten-files-ten-languages; do
  . "$cli_root/commands/$scenario.sh"
  hyperfine \
    --output=null \
    --style=basic \
    --warmup "${BENCH_WARMUP:-1}" \
    --min-runs "${BENCH_RUNS:-5}" \
    --export-json "$BENCH_RUN_DIR/cli/$scenario.json" \
    --command-name lumis-cli "$LUMIS_CLI_COMMAND" \
    --command-name bat "$BAT_COMMAND"
done
'''

[tasks.merge]
description = "Merge Total results and validate execution metadata"
run = "node benchmarks/scripts/merge-results.mjs"

[tasks."package-sizes"]
description = "Measure comparable local release and package artifacts"
depends = ["install", "build:rust-sizes", "build:cli", "build:elixir"]
run = 'BAT_BINARY="$(command -v bat)" node benchmarks/scripts/measure-package-sizes.mjs'

[tasks.run]
description = "Run all four benchmark scenarios"
depends = ["build"]
run = '''
rm -rf "$BENCH_RUN_DIR"
mkdir -p "$BENCH_RUN_DIR"
mise run --skip-deps -C "$MISE_CONFIG_ROOT" rust
mise run --skip-deps -C "$MISE_CONFIG_ROOT" javascript
mise run --skip-deps -C "$MISE_CONFIG_ROOT" elixir
mise run --skip-deps -C "$MISE_CONFIG_ROOT" cli
mise run --skip-deps -C "$MISE_CONFIG_ROOT" package-sizes
mise run --skip-deps -C "$MISE_CONFIG_ROOT" merge
'''
