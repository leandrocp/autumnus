name: Format

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
    paths:
      - "**/*.cjs"
      - "**/*.js"
      - "**/*.jsx"
      - "**/*.lua"
      - "**/*.mjs"
      - "**/*.ts"
      - "**/*.tsx"
      - ".oxfmtrc.json"
      - "mise.toml"
      - ".github/workflows/format.yml"
  pull_request:
    paths:
      - "**/*.cjs"
      - "**/*.js"
      - "**/*.jsx"
      - "**/*.lua"
      - "**/*.mjs"
      - "**/*.ts"
      - "**/*.tsx"
      - ".oxfmtrc.json"
      - "mise.toml"
      - ".github/workflows/format.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  format:
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          (github.event_name == 'pull_request' && github.head_ref != 'knope/release') ||
          (github.event_name == 'push' && !startsWith(github.event.head_commit.message, 'chore: prepare releases')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: mise run fmt-js -- --check
      - run: mise run fmt-lua -- --check
