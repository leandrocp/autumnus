name: Benchmarks

concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

on:
  pull_request:

jobs:
  benchmark:
    name: Benchmark / ${{ matrix.label }}
    continue-on-error: true
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Rust and syntect
            task: rust
          - label: JavaScript and Shiki
            task: javascript
          - label: Elixir
            task: elixir
          - label: CLI and bat
            task: cli
          - label: Package sizes
            task: package-sizes
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v4.2.1
        with:
          version: 2026.7.3
          working_directory: benchmarks
          install_args: --locked
          cache: true
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          workspaces: |
            .
            benchmarks/rust
      - name: Run benchmark suite
        env:
          BENCH_RUNS: 3
          BENCH_SAMPLES: 3
          BENCH_WARMUP: 1
          BENCH_WARMUP_SECONDS: 0.1
        run: mise run -C benchmarks ${{ matrix.task }}
      - name: Upload partial benchmark report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: lumis-benchmark-part-${{ matrix.task }}-${{ github.sha }}
          path: target/benchmarks/runs/current
          if-no-files-found: error
          retention-days: 1

  report:
    name: Benchmark suite
    needs: benchmark
    if: always()
    continue-on-error: true
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
      - name: Download partial benchmark reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: lumis-benchmark-part-*-${{ github.sha }}
          path: target/benchmarks/runs/current
          merge-multiple: true
      - name: Merge and validate benchmark reports
        run: |
          node benchmarks/scripts/verify-fixtures.mjs
          node benchmarks/scripts/merge-results.mjs
      - name: Publish benchmark values
        if: always()
        run: |
          summary=target/benchmarks/runs/current/results.md
          if [ -f "$summary" ]; then
            cat "$summary" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload benchmark reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: lumis-benchmarks-${{ github.sha }}
          path: target/benchmarks/runs/current
          if-no-files-found: warn
          retention-days: 7
