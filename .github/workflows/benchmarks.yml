name: Benchmarks

concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

on:
  pull_request:

jobs:
  benchmark:
    name: Benchmark suite
    continue-on-error: true
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: jdx/mise-action@dad1bfd3df957f44999b559dd69dc1671cb4e9ea
        with:
          version: 2026.7.3
          working_directory: benchmarks
          install_args: --locked
          cache: true
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          workspaces: |
            .
            benchmarks/rust
      - name: Run benchmark suite
        run: mise run bench-dev
      - name: Publish benchmark values
        if: always()
        run: |
          summary=target/benchmarks/runs/current/summary.md
          if [ -f "$summary" ]; then
            cat "$summary" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload benchmark reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: lumis-benchmarks-${{ github.sha }}
          path: target/benchmarks/runs/current
          if-no-files-found: warn
          retention-days: 7
