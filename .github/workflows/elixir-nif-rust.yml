name: Elixir NIF Rust CI

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
    paths:
      - "packages/elixir/lumis/native/**"
      - "crates/**"
      - "queries/**"
      - ".github/workflows/elixir-nif-rust.yml"
  pull_request:
    paths:
      - "packages/elixir/lumis/native/**"
      - "crates/**"
      - "queries/**"
      - ".github/workflows/elixir-nif-rust.yml"
  workflow_dispatch:

jobs:
  test:
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          (github.event_name == 'pull_request' && !startsWith(github.head_ref, 'release-please--')) ||
          (github.event_name == 'push' && !startsWith(github.event.head_commit.message, 'chore(main): release ')) }}
    uses: leandrocp/github-actions/.github/workflows/rust-test.yml@main
    with:
      manifest-path: 'packages/elixir/lumis/native/lumis_nif/Cargo.toml'
      msrv: '1.91'
  lint:
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          (github.event_name == 'pull_request' && !startsWith(github.head_ref, 'release-please--')) ||
          (github.event_name == 'push' && !startsWith(github.event.head_commit.message, 'chore(main): release ')) }}
    uses: leandrocp/github-actions/.github/workflows/rust-lint.yml@main
    with:
      manifest-path: 'packages/elixir/lumis/native/lumis_nif/Cargo.toml'
      msrv: '1.91'
