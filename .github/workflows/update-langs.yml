name: Update Languages

on:
  schedule:
    - cron: "0 22 * * 0"
  workflow_dispatch:
  push:
    tags-ignore:
      - "**"
    paths:
      - ".github/workflows/update-langs.yml"

jobs:
  generate-matrix:
    runs-on: ubuntu-latest
    outputs:
      languages: ${{ steps.set-matrix.outputs.languages }}
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: leafo/gh-actions-lua@v12

      - uses: leafo/gh-actions-luarocks@v6

      - name: Install Lua dependencies
        run: luarocks install toml-edit

      - name: Generate language matrix
        id: set-matrix
        run: |
          LANGS=$(lua -e "
            local toml_edit = require('toml_edit')
            local f = io.open('languages.toml', 'r')
            local tbl = toml_edit.parse_as_tbl(f:read('*a'))
            f:close()
            local names = {}
            for k, v in pairs(tbl.parsers) do
              if v.git then names[#names+1] = k end
            end
            table.sort(names)
            io.write('[\"' .. table.concat(names, '\",\"') .. '\"]')
          ")
          echo "Generated matrix for languages: $LANGS"
          echo "languages=$LANGS" >> $GITHUB_OUTPUT

  update-parsers:
    needs: generate-matrix
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJson(needs.generate-matrix.outputs.languages) }}

    steps:
      - uses: actions/checkout@v6

      - uses: taiki-e/install-action@just

      - uses: leafo/gh-actions-lua@v12

      - uses: leafo/gh-actions-luarocks@v6

      - name: Install Lua dependencies
        run: luarocks install toml-edit && luarocks install dkjson

      - uses: pnpm/action-setup@v5
        with:
          version: 10

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: packages/javascript/pnpm-lock.yaml

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile
        working-directory: packages/javascript

      - run: just langs-update ${{ matrix.language }}

      - name: Regenerate JavaScript outputs
        run: pnpm --filter @lumis-sh/lumis build:generate
        working-directory: packages/javascript

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.CI_TOKEN }}
          add-paths: |
            languages.toml
            crates/lumis/vendored_parsers
            queries/upstream
            queries/processed
            queries/overrides
            LANGUAGES.md
            packages/javascript/lumis/langs
            packages/javascript/lumis/bundles
            packages/javascript/lumis/src/generated
            packages/javascript/wasm-bundle-*
          commit-message: "chore: update ${{ matrix.language }}"
          title: "chore: update ${{ matrix.language }}"
          body: |
            Automated PR to update parser and queries for **${{ matrix.language }}**.

            This PR was created automatically by the update-langs workflow.
          branch: update-langs-${{ matrix.language }}
          delete-branch: true
          base: main
