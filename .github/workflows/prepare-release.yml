name: Prepare Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  prepare-release:
    if: "${{ github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'chore: prepare releases') }}"
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.RELEASE_TOKEN != '' && secrets.RELEASE_TOKEN || github.token }}
      GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN != '' && secrets.RELEASE_TOKEN || github.token }}
      RELEASE_BRANCH: knope/release
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN != '' && secrets.RELEASE_TOKEN || github.token }}

      - name: Configure git author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - uses: knope-dev/action@v2.1.2
        with:
          version: 0.22.4

      - name: Build release branch
        run: git switch -C "$RELEASE_BRANCH"

      - name: Prepare release changes
        run: knope prepare-release --verbose

      - name: Detect release changes
        id: changes
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit release branch
        if: "${{ steps.changes.outputs.has_changes == 'true' }}"
        run: 'git commit -m "chore: prepare releases"'

      - name: Push release branch
        if: "${{ steps.changes.outputs.has_changes == 'true' }}"
        run: git push --force --set-upstream origin "$RELEASE_BRANCH"

      - name: Create or update release PR
        if: "${{ steps.changes.outputs.has_changes == 'true' }}"
        run: |
          pr_number="$(gh pr list --head "$RELEASE_BRANCH" --base main --state open --json number --jq '.[0].number')"
          body=$'This PR was created by Knope.\n\nMerging it will tag and release every package prepared in this branch.'
          if [ -n "$pr_number" ]; then
            gh pr edit "$pr_number" --title "chore: prepare releases" --body "$body"
          else
            gh pr create --base main --head "$RELEASE_BRANCH" --title "chore: prepare releases" --body "$body"
          fi
