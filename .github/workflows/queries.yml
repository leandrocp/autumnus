name: Queries CI

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main ]
    paths:
      - "queries/**"
      - "languages.toml"
      - "crates/lumis-build/**"
      - "crates/dev/**"
      - "packages/javascript/lumis/test/query-compile.test.ts"
      - "packages/javascript/lumis/test/query-patterns.test.ts"
      - "packages/javascript/lumis/test/unverified-parsers.json"
      - "packages/javascript/lumis/scripts/list-unverified-parsers.mjs"
      - "mise.toml"
      - ".github/workflows/queries.yml"
  pull_request:
    paths:
      - "queries/**"
      - "languages.toml"
      - "crates/lumis-build/**"
      - "crates/dev/**"
      - "packages/javascript/lumis/test/query-compile.test.ts"
      - "packages/javascript/lumis/test/query-patterns.test.ts"
      - "packages/javascript/lumis/test/unverified-parsers.json"
      - "packages/javascript/lumis/scripts/list-unverified-parsers.mjs"
      - "mise.toml"
      - ".github/workflows/queries.yml"
  workflow_dispatch:

env:
  # Must match wasm-release.yml. Emscripten 6 produces side modules whose external
  # scanner exports web-tree-sitter cannot bind, so a parser built with it fails to
  # load: `bad export type for tree_sitter_<lang>_external_scanner_create`.
  EMSDK_VERSION: "5.0.3"
  QUERY_SHARDS: 8

jobs:
  # Regex validity and cross-engine portability need no grammar, so this covers
  # every language in seconds and is the guard that catches a bad Lua-pattern
  # translation. It also checks the waiver, which only depends on npm state.
  portability:
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          (github.event_name == 'pull_request' && github.head_ref != 'knope/release') ||
          (github.event_name == 'push' && !startsWith(github.event.head_commit.message, 'chore: prepare releases')) }}
    name: Portability
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile

      - name: Processed queries are up to date
        run: |
          cargo run --manifest-path crates/dev/Cargo.toml --no-default-features -- preprocess-queries
          git diff --exit-code -- queries/processed

      - name: Every predicate compiles under the regex crate
        run: cargo test -p lumis-build

      - name: Every predicate compiles under RegExp
        run: pnpm --filter @lumis-sh/lumis exec vitest run test/query-patterns.test.ts

  # Grammar-aware compilation needs a parser per language. Published packages are
  # used when their revision matches, and only the lagging ones are built, so this
  # shrinks as the catalog is republished. Sharded because building a parser takes
  # roughly 13 seconds and the lag is currently most of the catalog.
  compile:
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          (github.event_name == 'pull_request' && github.head_ref != 'knope/release') ||
          (github.event_name == 'push' && !startsWith(github.event.head_commit.message, 'chore: prepare releases')) }}
    name: Compile queries (shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4.2.1
        with:
          version: 2026.7.3
          install: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile

      - uses: mymindstorm/setup-emsdk@v16
        with:
          version: ${{ env.EMSDK_VERSION }}
          actions-cache-folder: emsdk-cache

      - name: Select this shard
        id: shard
        run: |
          set -euo pipefail
          cd packages/javascript/lumis
          node scripts/list-unverified-parsers.mjs > /tmp/languages.txt
          node scripts/list-unverified-parsers.mjs --parsers > /tmp/parsers.txt
          awk -v s="$SHARD" -v n="$SHARDS" 'NR % n == s % n' /tmp/languages.txt > /tmp/shard-languages.txt
          awk -v s="$SHARD" -v n="$SHARDS" 'NR % n == s % n' /tmp/parsers.txt > /tmp/shard-parsers.txt
          echo "languages=$(paste -sd, /tmp/shard-languages.txt)" >> "$GITHUB_OUTPUT"
          echo "parser count: $(wc -l < /tmp/shard-parsers.txt)"
        env:
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ env.QUERY_SHARDS }}

      - name: Build the parsers this shard needs
        run: |
          set -euo pipefail
          while read -r parser; do
            [ -n "$parser" ] && mise run wasm-build "$parser"
          done < /tmp/shard-parsers.txt

      - name: Compile queries for this shard
        # Every language in the shard had its parser built above, so anything left
        # unverified is a build failure rather than a lagging package.
        run: pnpm --filter @lumis-sh/lumis exec vitest run test/query-compile.test.ts
        env:
          LUMIS_QUERY_LANGUAGES: ${{ steps.shard.outputs.languages }}
          LUMIS_QUERY_COVERAGE: complete

  # Languages whose published package already matches languages.toml need no
  # parser build, so they are checked in one fast job.
  compile-published:
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          (github.event_name == 'pull_request' && github.head_ref != 'knope/release') ||
          (github.event_name == 'push' && !startsWith(github.event.head_commit.message, 'chore: prepare releases')) }}
    name: Compile queries (published parsers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile

      - name: Compile queries and check the waiver
        run: pnpm --filter @lumis-sh/lumis exec vitest run test/query-compile.test.ts
