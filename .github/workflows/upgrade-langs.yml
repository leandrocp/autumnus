name: Upgrade Languages

on:
  schedule:
    - cron: "0 22 * * 0"
  workflow_dispatch:
  push:
    tags-ignore:
      - "**"
    paths:
      - ".github/workflows/upgrade-langs.yml"

jobs:
  generate-matrix:
    runs-on: ubuntu-latest
    outputs:
      languages: ${{ steps.set-matrix.outputs.languages }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: leafo/gh-actions-lua@v13

      - uses: leafo/gh-actions-luarocks@v6

      - name: Install Lua dependencies
        run: luarocks install toml-edit

      - name: Generate language matrix
        id: set-matrix
        run: |
          LANGS=$(lua -e "
            local toml_edit = require('toml_edit')
            local f = io.open('languages.toml', 'r')
            local tbl = toml_edit.parse_as_tbl(f:read('*a'))
            f:close()
            local names = {}
            for k, v in pairs(tbl.parsers) do
              if v.git then names[#names+1] = k end
            end
            table.sort(names)
            io.write('[\"' .. table.concat(names, '\",\"') .. '\"]')
          ")
          echo "Generated matrix for languages: $LANGS"
          echo "languages=$LANGS" >> "$GITHUB_OUTPUT"

  rust-cache:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "crates/dev -> target"
          shared-key: upgrade-langs-dev

      - name: Build dev tool
        run: >-
          cargo build --manifest-path crates/dev/Cargo.toml
          --no-default-features

  upgrade-languages:
    needs: [generate-matrix, rust-cache]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJson(needs.generate-matrix.outputs.languages) }}

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "crates/dev -> target"
          shared-key: upgrade-langs-dev
          save-if: false

      - uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d
        with:
          version: 2026.7.3
          install: false

      - uses: leafo/gh-actions-lua@v13

      - uses: leafo/gh-actions-luarocks@v6

      - name: Install Lua dependencies
        run: luarocks install toml-edit && luarocks install dkjson

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - run: npm install -g tree-sitter-cli@0.26

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Upgrade language
        run: mise run langs-upgrade ${{ matrix.language }}

      - name: Check for changes
        id: check-changes
        run: |
          if git diff --quiet; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "No changes for ${{ matrix.language }}, skipping PR"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "Changes detected for ${{ matrix.language }}:"
            git diff --stat
          fi

      - name: Create Pull Request
        id: create-pr
        if: steps.check-changes.outputs.skip != 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.CI_TOKEN }}
          add-paths: |
            languages.toml
            crates/lumis/Cargo.toml
            crates/lumis/vendored_parsers
            queries/upstream
            queries/processed
            queries/override
            queries/append
            packages/javascript/lumis/langs
            packages/javascript/lumis/bundles
            packages/javascript/lumis/src/generated
            packages/javascript/wasm-bundle-*
          commit-message: "feat: upgrade lang ${{ matrix.language }}"
          title: "feat: upgrade lang ${{ matrix.language }}"
          body: |
            Automated PR to upgrade parser and queries for
            **${{ matrix.language }}**.

            This PR was created automatically by the upgrade-langs workflow.
          branch: upgrade-langs-${{ matrix.language }}
          delete-branch: true
          base: main
