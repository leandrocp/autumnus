name: WASM Release

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read

on:
  push:
    branches: [main]
    paths:
      - "languages.toml"
      - "crates/dev/**"
      - "crates/lumis/vendored_parsers/**"
      - "queries/**"
      - "crates/dev/**"
      - "packages/javascript/lumis/bundles/**"
      - "packages/javascript/lumis/langs/**"
      - "packages/javascript/lumis/src/generated/**"
      - "packages/javascript/wasm-bundle-*/**"
      - "mise.toml"
      - ".github/workflows/wasm-release.yml"
      - ".github/workflows/upgrade-langs.yml"
  workflow_dispatch:
    inputs:
      parser:
        description: "Parser name(s), comma-separated (leave empty for all)"
        required: false
        default: ""
      force:
        description: >-
          Publish even when the current parser revision already exists
        required: false
        default: false
        type: boolean

jobs:
  detect:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    outputs:
      parsers: ${{ steps.needed.outputs.parsers }}
      skip: ${{ steps.needed.outputs.skip }}
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v4.2.3

      - uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
          registry-url: "https://registry.npmjs.org"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "crates/dev -> target"
          shared-key: wasm-release-detect

      - name: Determine which parsers need publishing
        id: needed
        env:
          PARSER_FILTER: ${{ inputs.parser }}
          FORCE_PUBLISH: ${{ inputs.force || 'false' }}
        run: |
          needed=$(mise run wasm-publish-needed \
            "$PARSER_FILTER" \
            "$FORCE_PUBLISH")
          if [ -z "$needed" ]; then
            echo "All packages already published, nothing to build"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo 'parsers=[]' >> "$GITHUB_OUTPUT"
          else
            echo "Need to build: $needed"
            echo "skip=false" >> "$GITHUB_OUTPUT"
            json=$(echo "$needed" | tr ' ' '\n' | jq -R . | jq -sc .)
            echo "parsers=$json" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: detect
    if: needs.detect.outputs.skip == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write

    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        parser: ${{ fromJson(needs.detect.outputs.parsers) }}

    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v4.2.3
        with:
          install: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: wasm-release
          add-job-id-key: false
      - name: Cache tree-sitter tool downloads
        uses: actions/cache@v6
        with:
          path: ~/.cache/tree-sitter
          key: ${{ runner.os }}-tree-sitter-cli-${{ hashFiles('mise.toml') }}
          restore-keys: |
            ${{ runner.os }}-tree-sitter-cli-

      - uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
          registry-url: "https://registry.npmjs.org"


      - name: Emscripten version from mise.toml
        id: emsdk
        run: echo "version=$(mise exec -- printenv LUMIS_EMSDK_VERSION)" >> "$GITHUB_OUTPUT"

      - uses: mymindstorm/setup-emsdk@v16
        with:
          version: ${{ steps.emsdk.outputs.version }}
          actions-cache-folder: emsdk-cache

      - run: mise run wasm-publish-prepare "$PARSER"
        env:
          PARSER: ${{ matrix.parser }}

      - name: Publish to npm
        run: |
          cd -- "tmp/wasm/publish/$PARSER"
          npm publish --access public --provenance
        env:
          PARSER: ${{ matrix.parser }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
