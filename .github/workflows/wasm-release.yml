name: WASM Release

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  EMSDK_VERSION: "5.0.3"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  push:
    branches: [main]
    paths:
      - "languages.toml"
      - "crates/dev/**"
      - "crates/lumis/vendored_parsers/**"
      - "queries/**"
      - "scripts/wasm-needed.py"
      - "packages/javascript/lumis/bundles/**"
      - "packages/javascript/lumis/langs/**"
      - "packages/javascript/lumis/src/generated/**"
      - "packages/javascript/wasm-bundle-*/**"
      - "mise.toml"
      - ".github/workflows/wasm-release.yml"
      - ".github/workflows/upgrade-langs.yml"
  workflow_dispatch:
    inputs:
      parser:
        description: "Parser name(s), comma-separated (leave empty for all)"
        required: false
        default: ""
      force:
        description: >-
          Publish even when the current parser revision already exists
        required: false
        default: false
        type: boolean

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      parsers: ${{ steps.needed.outputs.parsers }}
      skip: ${{ steps.needed.outputs.skip }}
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d
        with:
          version: 2026.7.3
          install: false

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Determine which parsers need publishing
        id: needed
        run: |
          needed=$(mise run wasm-publish-needed \
            "${{ inputs.parser }}" \
            "${{ inputs.force || 'false' }}")
          if [ -z "$needed" ]; then
            echo "All packages already published, nothing to build"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo 'parsers=[]' >> "$GITHUB_OUTPUT"
          else
            echo "Need to build: $needed"
            echo "skip=false" >> "$GITHUB_OUTPUT"
            json=$(echo "$needed" | tr ' ' '\n' | jq -R . | jq -sc .)
            echo "parsers=$json" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: detect
    if: needs.detect.outputs.skip == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      id-token: write

    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        parser: ${{ fromJson(needs.detect.outputs.parsers) }}

    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d
        with:
          version: 2026.7.3
          install: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: wasm-release
          add-job-id-key: false
      - name: Cache tree-sitter tool downloads
        uses: actions/cache@v6
        with:
          path: ~/.cache/tree-sitter
          key: ${{ runner.os }}-tree-sitter-cli-0.26-v1
          restore-keys: |
            ${{ runner.os }}-tree-sitter-cli-0.26-

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - uses: mymindstorm/setup-emsdk@v16
        with:
          version: ${{ env.EMSDK_VERSION }}
          actions-cache-folder: emsdk-cache

      - run: npm install -g tree-sitter-cli@0.26

      - run: mise run wasm-publish-prepare "${{ matrix.parser }}"

      - name: Publish to npm
        working-directory: tmp/wasm-publish/${{ matrix.parser }}
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
