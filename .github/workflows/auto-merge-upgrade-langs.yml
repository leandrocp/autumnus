name: Auto-merge Language Upgrades

on:
  workflow_run:
    workflows: ["Conformance"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  merge:
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Merge matching upgrade PR
        env:
          GH_TOKEN: ${{ secrets.CI_TOKEN }}
          REPO: ${{ github.repository }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          if [ -z "$HEAD_BRANCH" ]; then
            exit 0
          fi

          pr=$(gh pr list \
            --repo "$REPO" \
            --state open \
            --head "$HEAD_BRANCH" \
            --json number \
            --jq '.[0].number')

          if [ -z "$pr" ]; then
            exit 0
          fi

          should_merge=$(gh pr view "$pr" \
            --repo "$REPO" \
            --json state,title,headRefName \
            --jq 'select(.state == "OPEN" and (.headRefName | startswith("upgrade-langs-")) and (.title | startswith("chore: upgrade "))) | .state')

          if [ "$should_merge" != "OPEN" ]; then
            exit 0
          fi

          gh pr merge "$pr" --repo "$REPO" --squash --delete-branch
