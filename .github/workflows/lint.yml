name: Lint

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
    paths:
      - "**/*.lua"
      - ".github/actionlint.yaml"
      - ".github/workflows/**"
      - "crates/autumnus/**"
      - "crates/dev/**"
      - "crates/lumis-wasm-runtime/src/catalog.rs"
      - "languages.toml"
      - "mise.toml"
  pull_request:
    paths:
      - "**/*.lua"
      - ".github/actionlint.yaml"
      - ".github/workflows/**"
      - "crates/autumnus/**"
      - "crates/dev/**"
      - "crates/lumis-wasm-runtime/src/catalog.rs"
      - "languages.toml"
      - "mise.toml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Run actionlint
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color

  lua:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
      - run: mise run fmt-lua -- --check

  rust-outside-workspace:
    name: Rust crates outside the workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt
      - run: cargo fmt --manifest-path crates/dev/Cargo.toml --check
      - run: cargo fmt --manifest-path crates/autumnus/Cargo.toml --check
      - run: cargo test --manifest-path crates/dev/Cargo.toml --no-default-features
