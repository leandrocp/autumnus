name: JavaScript Lockfile

on:
  push:
    branches:
      - main
    paths:
      - "packages/javascript/**"
      - ".github/workflows/javascript-*.yml"

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v5
        with:
          version: 10

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: packages/javascript/pnpm-lock.yaml

      - name: Verify JavaScript lockfile
        run: pnpm install --frozen-lockfile
        working-directory: packages/javascript
