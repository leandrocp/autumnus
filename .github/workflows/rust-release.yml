name: Rust Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (for example: cargo-lumis/v0.2.1)"
        required: true
        type: string
  push:
    tags:
      - "cargo-lumis/v*"
      - "cargo-lumis-core/v*"
      - "cargo-lumis-build/v*"
      - "cargo-lumis-cli/v*"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - uses: dtolnay/rust-toolchain@stable

      - name: Determine crate to publish
        id: crate
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          component="${tag%%/v*}"
          case "$component" in
            cargo-lumis)
              crate="lumis"
              manifest="crates/lumis/Cargo.toml"
              ;;
            cargo-lumis-core)
              crate="lumis-core"
              manifest="crates/lumis-core/Cargo.toml"
              ;;
            cargo-lumis-build)
              crate="lumis-build"
              manifest="crates/lumis-build/Cargo.toml"
              ;;
            cargo-lumis-cli)
              crate="lumis-cli"
              manifest="crates/lumis-cli/Cargo.toml"
              ;;
            *)
              echo "Unknown component: $component" >&2
              exit 1
              ;;
          esac
          echo "name=$crate" >> "$GITHUB_OUTPUT"
          echo "manifest=$manifest" >> "$GITHUB_OUTPUT"

      - name: Publish to crates.io
        run: cargo publish -p ${{ steps.crate.outputs.name }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
