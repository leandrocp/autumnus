name: Rust Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (for example: rust@v0.2.1)"
        required: true
        type: string
  push:
    tags:
      - "rust@v*"
      - "rust-core@v*"
      - "rust-build@v*"
      - "rust-cli@v*"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - uses: dtolnay/rust-toolchain@stable

      - name: Determine crate to publish
        id: crate
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          component="${tag%%@*}"
          case "$component" in
            rust)
              crate="lumis"
              manifest="crates/lumis/Cargo.toml"
              ;;
            rust-core)
              crate="lumis-core"
              manifest="crates/lumis-core/Cargo.toml"
              ;;
            rust-build)
              crate="lumis-build"
              manifest="crates/lumis-build/Cargo.toml"
              ;;
            rust-cli)
              crate="lumis-cli"
              manifest="crates/lumis-cli/Cargo.toml"
              ;;
            *)
              echo "Unknown component: $component" >&2
              exit 1
              ;;
          esac
          version=$(python3 ./scripts/verify-rust-publish.py print-version "$manifest")
          echo "name=$crate" >> "$GITHUB_OUTPUT"
          echo "manifest=$manifest" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Verify publish prerequisites
        run: python3 ./scripts/verify-rust-publish.py "${{ steps.crate.outputs.manifest }}" "${{ steps.crate.outputs.name }}"

      - name: Publish to crates.io
        run: cargo publish -p ${{ steps.crate.outputs.name }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
