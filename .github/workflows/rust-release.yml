name: Rust Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (for example: cargo-lumis/v0.2.1)"
        required: true
        type: string
  push:
    tags:
      - "cargo-lumis/v*"
      - "cargo-lumis-core/v*"
      - "cargo-lumis-build/v*"
      - "cargo-lumis-wasm-runtime/v*"
      - "cargo-lumis-cli/v*"

permissions:
  contents: read

jobs:
  publish:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Determine crate to publish
        id: crate
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          tag="$RELEASE_TAG"
          component="${tag%%/v*}"
          case "$component" in
            cargo-lumis)
              crate="lumis"
              manifest="crates/lumis/Cargo.toml"
              ;;
            cargo-lumis-core)
              crate="lumis-core"
              manifest="crates/lumis-core/Cargo.toml"
              ;;
            cargo-lumis-build)
              crate="lumis-build"
              manifest="crates/lumis-build/Cargo.toml"
              ;;
            cargo-lumis-wasm-runtime)
              crate="lumis-wasm-runtime"
              manifest="crates/lumis-wasm-runtime/Cargo.toml"
              ;;
            cargo-lumis-cli)
              crate="lumis-cli"
              manifest="crates/lumis-cli/Cargo.toml"
              ;;
            *)
              echo "Unknown component: $component" >&2
              exit 1
              ;;
          esac
          echo "name=$crate" >> "$GITHUB_OUTPUT"
          echo "manifest=$manifest" >> "$GITHUB_OUTPUT"

      - name: Publish to crates.io
        run: cargo publish -p "$CRATE_NAME"
        env:
          CRATE_NAME: ${{ steps.crate.outputs.name }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
