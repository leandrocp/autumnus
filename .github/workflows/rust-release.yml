name: Rust Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (for example: rust@v0.2.1)"
        required: true
        type: string
  push:
    tags:
      - "rust@v*"
      - "rust-core@v*"
      - "rust-build@v*"
      - "rust-cli@v*"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - uses: dtolnay/rust-toolchain@stable

      - name: Determine crate to publish
        id: crate
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          component="${tag%%@*}"
          case "$component" in
            rust)       crate="lumis" ;;
            rust-core)  crate="lumis-core" ;;
            rust-build) crate="lumis-build" ;;
            rust-cli)   crate="lumis-cli" ;;
            *)          echo "Unknown component: $component" && exit 1 ;;
          esac
          echo "name=$crate" >> $GITHUB_OUTPUT

      - name: Publish to crates.io
        run: cargo publish -p ${{ steps.crate.outputs.name }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
