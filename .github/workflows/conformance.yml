name: Conformance

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

on:
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "queries/**"
      - "languages.toml"
      - "fixtures/conformance/**"
      - "packages/javascript/lumis/**"
      - "packages/javascript/package.json"
      - "packages/javascript/themes/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "packages/elixir/lumis/**"
      - "mise.toml"
      - ".github/workflows/conformance.yml"
  pull_request:
    paths:
      - "crates/**"
      - "queries/**"
      - "languages.toml"
      - "fixtures/conformance/**"
      - "packages/javascript/lumis/**"
      - "packages/javascript/package.json"
      - "packages/javascript/themes/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "packages/elixir/lumis/**"
      - "mise.toml"
      - ".github/workflows/conformance.yml"
  workflow_dispatch:

jobs:
  conformance:
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          (github.event_name == 'pull_request' && github.head_ref != 'knope/release') ||
          (github.event_name == 'push' && !startsWith(github.event.head_commit.message, 'chore: prepare releases')) }}
    name: Conformance
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.19.x"
          otp-version: "28.x"

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - uses: jdx/mise-action@v4.2.1
        with:
          version: 2026.7.3
          install: false

      - run: pnpm install --frozen-lockfile

      - run: mix deps.get
        working-directory: packages/elixir/lumis

      - run: mise run test-conformance

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: javascript-browser-conformance-results
          path: packages/javascript/lumis/test-results
          if-no-files-found: ignore
          retention-days: 7
