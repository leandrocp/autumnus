name: Conformance

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

on:
  push:
    branches: [ main ]
    paths:
      - "crates/**"
      - "queries/**"
      - "languages.toml"
      - "fixtures/conformance/**"
      - "packages/javascript/lumis/**"
      - "packages/javascript/package.json"
      - "packages/javascript/themes/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "packages/elixir/lumis/**"
      - ".github/workflows/conformance.yml"
  pull_request:
    paths:
      - "crates/**"
      - "queries/**"
      - "languages.toml"
      - "fixtures/conformance/**"
      - "packages/javascript/lumis/**"
      - "packages/javascript/package.json"
      - "packages/javascript/themes/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "packages/elixir/lumis/**"
      - ".github/workflows/conformance.yml"
  workflow_dispatch:

jobs:
  changes:
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          (github.event_name == 'pull_request' && github.head_ref != 'knope/release') ||
          (github.event_name == 'push' && !startsWith(github.event.head_commit.message, 'chore: prepare releases')) }}
    name: Detect changed areas
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      cli: ${{ steps.filter.outputs.cli }}
      javascript: ${{ steps.filter.outputs.javascript }}
      elixir: ${{ steps.filter.outputs.elixir }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            rust:
              - 'crates/lumis/**'
              - 'crates/lumis-core/**'
              - 'queries/**'
              - 'fixtures/conformance/**'
              - 'languages.toml'
              - '.github/workflows/conformance.yml'
            cli:
              - 'crates/lumis-cli/**'
              - 'crates/lumis-core/**'
              - 'queries/**'
              - 'fixtures/conformance/**'
              - 'languages.toml'
              - '.github/workflows/conformance.yml'
            javascript:
              - 'packages/javascript/lumis/**'
              - 'crates/lumis-wasm-runtime/**'
              - 'packages/javascript/package.json'
              - 'packages/javascript/themes/**'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'queries/**'
              - 'fixtures/conformance/**'
              - 'languages.toml'
              - '.github/workflows/conformance.yml'
            elixir:
              - 'crates/lumis/**'
              - 'crates/lumis-core/**'
              - 'queries/**'
              - 'languages.toml'
              - 'packages/elixir/lumis/**'
              - 'fixtures/conformance/**'
              - '.github/workflows/conformance.yml'

  rust:
    name: Rust conformance
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - uses: Swatinem/rust-cache@v2
      - run: cargo nextest run -p lumis --test formatter_conformance --run-ignored ignored-only

  cli:
    name: CLI conformance
    needs: changes
    if: needs.changes.outputs.cli == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - uses: Swatinem/rust-cache@v2
      - run: cargo nextest run -p lumis-cli --test conformance --run-ignored ignored-only

  javascript:
    name: JS ${{ matrix.runtime }} conformance
    needs: changes
    if: needs.changes.outputs.javascript == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime: Wasm
            disable-native: '1'
            require-native: '0'
            build-native: false
          - runtime: native
            disable-native: '0'
            require-native: '1'
            build-native: true
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        if: matrix.build-native
      - uses: Swatinem/rust-cache@v2
        if: matrix.build-native
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @lumis-sh/themes build
      - run: pnpm --filter @lumis-sh/lumis build
      - run: pnpm --filter @lumis-sh/lumis build:native
        if: matrix.build-native
      - run: pnpm --filter @lumis-sh/lumis test:conformance
        env:
          LUMIS_DISABLE_NATIVE: ${{ matrix.disable-native }}
          LUMIS_REQUIRE_NATIVE: ${{ matrix.require-native }}

  elixir:
    name: Elixir conformance
    needs: changes
    if: needs.changes.outputs.elixir == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LUMIS_BUILD: "1"
      MIX_ENV: test
    steps:
      - uses: actions/checkout@v7
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.19.x'
          otp-version: '28.x'
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - uses: actions/cache@v6
        with:
          path: |
            packages/elixir/lumis/deps
            packages/elixir/lumis/_build
          key: ${{ runner.os }}-conformance-mix-${{ hashFiles('packages/elixir/lumis/mix.lock') }}
          restore-keys: ${{ runner.os }}-conformance-mix-
      - run: mix deps.get
        working-directory: packages/elixir/lumis
      - run: mix test --include conformance test/conformance_test.exs
        working-directory: packages/elixir/lumis
