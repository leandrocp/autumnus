name: Conformance

permissions:
  contents: read
  pull-requests: read

on:
  push:
    branches: [ main ]
    paths:
      - "crates/**"
      - "queries/**"
      - "languages.toml"
      - "fixtures/conformance/**"
      - "packages/javascript/lumis/**"
      - "packages/javascript/themes/**"
      - "packages/elixir/lumis/**"
      - ".github/workflows/conformance.yml"
  pull_request:
    paths:
      - "crates/**"
      - "queries/**"
      - "languages.toml"
      - "fixtures/conformance/**"
      - "packages/javascript/lumis/**"
      - "packages/javascript/themes/**"
      - "packages/elixir/lumis/**"
      - ".github/workflows/conformance.yml"
  workflow_dispatch:

jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      cli: ${{ steps.filter.outputs.cli }}
      javascript: ${{ steps.filter.outputs.javascript }}
      elixir: ${{ steps.filter.outputs.elixir }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            rust:
              - 'crates/lumis/**'
              - 'crates/lumis-core/**'
              - 'queries/**'
              - 'fixtures/conformance/**'
              - 'languages.toml'
              - '.github/workflows/conformance.yml'
            cli:
              - 'crates/lumis-cli/**'
              - 'crates/lumis-core/**'
              - 'queries/**'
              - 'fixtures/conformance/**'
              - 'languages.toml'
              - '.github/workflows/conformance.yml'
            javascript:
              - 'packages/javascript/lumis/**'
              - 'packages/javascript/themes/**'
              - 'queries/**'
              - 'fixtures/conformance/**'
              - 'languages.toml'
              - '.github/workflows/conformance.yml'
            elixir:
              - 'packages/elixir/lumis/**'
              - 'fixtures/conformance/**'
              - '.github/workflows/conformance.yml'

  rust:
    name: Rust conformance
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - uses: Swatinem/rust-cache@v2
      - run: cargo nextest run -p lumis --test formatter_conformance

  cli:
    name: CLI conformance
    needs: changes
    if: needs.changes.outputs.cli == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - uses: Swatinem/rust-cache@v2
      - run: cargo nextest run -p lumis-cli --test conformance

  javascript:
    name: JS conformance
    needs: changes
    if: needs.changes.outputs.javascript == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
        with:
          version: 10
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: packages/javascript/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: packages/javascript
      - run: pnpm --filter @lumis-sh/themes build
        working-directory: packages/javascript
      - run: pnpm --filter @lumis-sh/lumis build
        working-directory: packages/javascript
      - run: pnpm vitest run test/conformance.test.ts
        working-directory: packages/javascript/lumis

  elixir:
    name: Elixir conformance
    needs: changes
    if: needs.changes.outputs.elixir == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LUMIS_BUILD: "1"
      MIX_ENV: test
    steps:
      - uses: actions/checkout@v6
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.19.x'
          otp-version: '28.x'
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - uses: actions/cache@v5
        with:
          path: |
            packages/elixir/lumis/deps
            packages/elixir/lumis/_build
          key: ${{ runner.os }}-conformance-mix-${{ hashFiles('packages/elixir/lumis/mix.lock') }}
          restore-keys: ${{ runner.os }}-conformance-mix-
      - run: mix deps.get
        working-directory: packages/elixir/lumis
      - run: mix test test/conformance_test.exs
        working-directory: packages/elixir/lumis
