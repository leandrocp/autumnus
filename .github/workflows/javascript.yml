name: JavaScript CI

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main ]
    paths:
      - "packages/javascript/lumis/**"
      - "packages/javascript/markdown-it-lumis/**"
      - "packages/javascript/rehype-lumis/**"
      - "packages/javascript/themes/**"
      - "packages/javascript/wasm-bundle-*/**"
      - "queries/**"
      - "languages.toml"
      - ".github/workflows/javascript.yml"
  pull_request:
    paths:
      - "packages/javascript/lumis/**"
      - "packages/javascript/markdown-it-lumis/**"
      - "packages/javascript/rehype-lumis/**"
      - "packages/javascript/themes/**"
      - "packages/javascript/wasm-bundle-*/**"
      - "queries/**"
      - "languages.toml"
      - ".github/workflows/javascript.yml"
  workflow_dispatch:

jobs:
  lint:
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          (github.event_name == 'pull_request' && !startsWith(github.head_ref, 'release-please--')) ||
          (github.event_name == 'push' && !startsWith(github.event.head_commit.message, 'chore(main): release ')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
        with:
          version: 10
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: packages/javascript/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: packages/javascript
      - run: pnpm --filter @lumis-sh/lumis fmt:check
        working-directory: packages/javascript
      - run: pnpm --filter @lumis-sh/lumis lint
        working-directory: packages/javascript
      - run: pnpm --filter @lumis-sh/markdown-it-lumis fmt:check
        working-directory: packages/javascript
      - run: pnpm --filter @lumis-sh/markdown-it-lumis lint
        working-directory: packages/javascript
      - run: pnpm --filter @lumis-sh/rehype-lumis fmt:check
        working-directory: packages/javascript
      - run: pnpm --filter @lumis-sh/rehype-lumis lint
        working-directory: packages/javascript
      - run: pnpm --filter @lumis-sh/themes fmt:check
        working-directory: packages/javascript
      - run: pnpm --filter @lumis-sh/themes lint
        working-directory: packages/javascript
      - run: pnpm run build:wasm-bundles && git diff --exit-code -- wasm-bundle-*
        working-directory: packages/javascript

  test:
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          (github.event_name == 'pull_request' && !startsWith(github.head_ref, 'release-please--')) ||
          (github.event_name == 'push' && !startsWith(github.event.head_commit.message, 'chore(main): release ')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
        with:
          version: 10
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: packages/javascript/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: packages/javascript
      - run: pnpm --filter @lumis-sh/themes build
        working-directory: packages/javascript
      - run: pnpm --filter @lumis-sh/lumis build
        working-directory: packages/javascript
      - run: pnpm --filter @lumis-sh/markdown-it-lumis build
        working-directory: packages/javascript
      - run: pnpm --filter @lumis-sh/rehype-lumis build
        working-directory: packages/javascript
      - run: pnpm --filter @lumis-sh/markdown-it-lumis test
        working-directory: packages/javascript
      - run: pnpm --filter @lumis-sh/rehype-lumis test
        working-directory: packages/javascript
      - run: pnpm --filter @lumis-sh/lumis test
        working-directory: packages/javascript
      - run: pnpm run build:wasm-bundles && git diff --exit-code -- wasm-bundle-*
        working-directory: packages/javascript
