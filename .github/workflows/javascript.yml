name: JavaScript CI

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main ]
    paths:
      - "packages/javascript/lumis/**"
      - "packages/javascript/markdown-it-lumis/**"
      - "packages/javascript/rehype-lumis/**"
      - "packages/javascript/react/**"
      - "packages/javascript/themes/**"
      - "packages/javascript/package.json"
      - "packages/javascript/wasm-bundle-*/**"
      - "crates/lumis-core/**"
      - "crates/lumis/**"
      - "crates/lumis-wasm-runtime/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "queries/**"
      - "languages.toml"
      - "mise.toml"
      - ".github/workflows/javascript.yml"
  pull_request:
    paths:
      - "packages/javascript/lumis/**"
      - "packages/javascript/markdown-it-lumis/**"
      - "packages/javascript/rehype-lumis/**"
      - "packages/javascript/react/**"
      - "packages/javascript/themes/**"
      - "packages/javascript/package.json"
      - "packages/javascript/wasm-bundle-*/**"
      - "crates/lumis-core/**"
      - "crates/lumis/**"
      - "crates/lumis-wasm-runtime/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "queries/**"
      - "languages.toml"
      - "mise.toml"
      - ".github/workflows/javascript.yml"
  workflow_dispatch:

jobs:
  lint:
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          (github.event_name == 'pull_request' && github.head_ref != 'knope/release') ||
          (github.event_name == 'push' && !startsWith(github.event.head_commit.message, 'chore: prepare releases')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4.2.3
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: mise run fmt-js -- --check
      - run: pnpm --filter @lumis-sh/lumis lint
      - run: pnpm --filter @lumis-sh/markdown-it-lumis lint
      - run: pnpm --filter @lumis-sh/rehype-lumis lint
      - run: pnpm --filter @lumis-sh/react lint
      - run: pnpm --filter @lumis-sh/themes lint
      - run: pnpm --dir packages/javascript run build:wasm-bundles && git diff --exit-code -- packages/javascript/wasm-bundle-*

  test:
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          (github.event_name == 'pull_request' && github.head_ref != 'knope/release') ||
          (github.event_name == 'push' && !startsWith(github.event.head_commit.message, 'chore: prepare releases')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @lumis-sh/themes build
      # Node highlights through the addon, so the tests build it and the parser
      # tree it resolves against.
      - run: cargo run -q --manifest-path crates/dev/Cargo.toml -- stage-test-parsers target/test-parsers
      - run: pnpm --filter @lumis-sh/lumis build:native
      - run: pnpm --filter @lumis-sh/lumis build
      - run: pnpm --filter @lumis-sh/markdown-it-lumis build
      - run: pnpm --filter @lumis-sh/rehype-lumis build
      - run: pnpm --filter @lumis-sh/react build
      - run: pnpm --filter @lumis-sh/markdown-it-lumis test
      - run: pnpm --filter @lumis-sh/rehype-lumis test
      - run: pnpm --filter @lumis-sh/lumis test
      - run: pnpm --filter @lumis-sh/react test
      - run: pnpm --dir packages/javascript run build:wasm-bundles && git diff --exit-code -- packages/javascript/wasm-bundle-*
