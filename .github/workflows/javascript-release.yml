name: JavaScript Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (for example: javascript@v0.0.1)"
        required: true
        type: string
  push:
    tags:
      - "javascript@v*"
      - "markdown-it-lumis@v*"
      - "rehype-lumis@v*"
      - "themes@v*"

permissions:
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - uses: pnpm/action-setup@v5
        with:
          version: 10

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          cache: "pnpm"
          cache-dependency-path: packages/javascript/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
        working-directory: packages/javascript

      - name: Determine package to publish
        id: pkg
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          component="${tag%%@*}"
          if [ "$component" = "themes" ]; then
            echo "filter=@lumis-sh/themes" >> $GITHUB_OUTPUT
            echo "build_lumis=false" >> $GITHUB_OUTPUT
            echo "build_markdown_it=false" >> $GITHUB_OUTPUT
            echo "build_rehype=false" >> $GITHUB_OUTPUT
          elif [ "$component" = "javascript" ]; then
            echo "filter=@lumis-sh/lumis" >> $GITHUB_OUTPUT
            echo "build_lumis=true" >> $GITHUB_OUTPUT
            echo "build_markdown_it=false" >> $GITHUB_OUTPUT
            echo "build_rehype=false" >> $GITHUB_OUTPUT
          elif [ "$component" = "markdown-it-lumis" ]; then
            echo "filter=@lumis-sh/markdown-it-lumis" >> $GITHUB_OUTPUT
            echo "build_lumis=true" >> $GITHUB_OUTPUT
            echo "build_markdown_it=true" >> $GITHUB_OUTPUT
            echo "build_rehype=false" >> $GITHUB_OUTPUT
          elif [ "$component" = "rehype-lumis" ]; then
            echo "filter=@lumis-sh/rehype-lumis" >> $GITHUB_OUTPUT
            echo "build_lumis=true" >> $GITHUB_OUTPUT
            echo "build_markdown_it=false" >> $GITHUB_OUTPUT
            echo "build_rehype=true" >> $GITHUB_OUTPUT
          else
            echo "Unknown component: $component" && exit 1
          fi

      - name: Build themes
        run: pnpm --filter @lumis-sh/themes build
        working-directory: packages/javascript

      - name: Build lumis
        if: steps.pkg.outputs.build_lumis == 'true'
        run: pnpm --filter @lumis-sh/lumis build
        working-directory: packages/javascript

      - name: Build markdown-it-lumis
        if: steps.pkg.outputs.build_markdown_it == 'true'
        run: pnpm --filter @lumis-sh/markdown-it-lumis build
        working-directory: packages/javascript

      - name: Build rehype-lumis
        if: steps.pkg.outputs.build_rehype == 'true'
        run: pnpm --filter @lumis-sh/rehype-lumis build
        working-directory: packages/javascript

      - name: Publish to npm
        run: pnpm --filter ${{ steps.pkg.outputs.filter }} publish --access public --no-git-checks --provenance
        working-directory: packages/javascript
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
