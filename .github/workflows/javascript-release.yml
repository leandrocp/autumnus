name: JavaScript Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (for example: npm-lumis/v0.0.1)"
        required: true
        type: string
  push:
    tags:
      - "npm-lumis/v*"
      - "npm-markdown-it-lumis/v*"
      - "npm-rehype-lumis/v*"
      - "npm-react/v*"
      - "npm-cli/v*"
      - "npm-themes/v*"
      - "npm-wasm-bundle-*/v*"

permissions:
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Determine package to publish
        id: pkg
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          component="${tag%%/v*}"
          set_output() {
            printf '%s=%s\n' "$1" "$2" >> "$GITHUB_OUTPUT"
          }

          if [ "$component" = "npm-themes" ]; then
            set_output filter "@lumis-sh/themes"
            set_output build_filters "@lumis-sh/themes"
          elif [ "$component" = "npm-lumis" ]; then
            set_output filter "@lumis-sh/lumis"
            set_output build_filters "@lumis-sh/themes @lumis-sh/lumis"
          elif [ "$component" = "npm-markdown-it-lumis" ]; then
            set_output filter "@lumis-sh/markdown-it-lumis"
            set_output build_filters "@lumis-sh/themes @lumis-sh/lumis @lumis-sh/markdown-it-lumis"
          elif [ "$component" = "npm-rehype-lumis" ]; then
            set_output filter "@lumis-sh/rehype-lumis"
            set_output build_filters "@lumis-sh/themes @lumis-sh/lumis @lumis-sh/rehype-lumis"
          elif [ "$component" = "npm-react" ]; then
            set_output filter "@lumis-sh/react"
            set_output build_filters "@lumis-sh/themes @lumis-sh/lumis @lumis-sh/react"
          elif [ "$component" = "npm-cli" ]; then
            set_output filter "@lumis-sh/cli"
            set_output build_filters ""
          elif [[ "$component" == npm-wasm-bundle-* ]]; then
            set_output filter "@lumis-sh/${component#npm-}"
            set_output build_filters "@lumis-sh/${component#npm-}"
          else
            echo "Unknown component: $component" && exit 1
          fi

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build publish target workspace packages
        if: steps.pkg.outputs.build_filters != ''
        run: |
          for pkg in ${{ steps.pkg.outputs.build_filters }}; do
            pnpm --filter "$pkg" run build
          done

      - name: Publish to npm
        run: pnpm --filter "${{ steps.pkg.outputs.filter }}" publish --access public --no-git-checks --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
