name: JavaScript Release

on:
  push:
    tags:
      - "javascript@v*"
      - "themes@v*"

permissions:
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v5
        with:
          version: 10

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          cache: "pnpm"
          cache-dependency-path: packages/javascript/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
        working-directory: packages/javascript

      - name: Determine package to publish
        id: pkg
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          component="${tag%%@*}"
          if [ "$component" = "themes" ]; then
            echo "filter=@lumis-sh/themes" >> $GITHUB_OUTPUT
          elif [ "$component" = "javascript" ]; then
            echo "filter=@lumis-sh/lumis" >> $GITHUB_OUTPUT
          fi

      - name: Build themes
        run: pnpm --filter @lumis-sh/themes build
        working-directory: packages/javascript

      - name: Build lumis
        if: contains(github.ref, 'javascript@')
        run: pnpm --filter @lumis-sh/lumis build
        working-directory: packages/javascript

      - name: Publish to npm
        run: pnpm --filter ${{ steps.pkg.outputs.filter }} publish --access public --no-git-checks --provenance
        working-directory: packages/javascript
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
