name: JavaScript Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (for example: npm-lumis/v0.0.1)"
        required: true
        type: string
  push:
    tags:
      - "npm-lumis/v*"
      - "npm-markdown-it-lumis/v*"
      - "npm-rehype-lumis/v*"
      - "npm-react/v*"
      - "npm-cli/v*"
      - "npm-themes/v*"
      - "npm-wasm-bundle-*/v*"

permissions:
  contents: read

jobs:
  build-native:
    if: ${{ startsWith(inputs.tag || github.ref_name, 'npm-lumis/v') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: darwin-arm64
            target: aarch64-apple-darwin
            os: macos-latest
            library: liblumis_js_native.dylib
          - package: darwin-x64
            target: x86_64-apple-darwin
            os: macos-15-intel
            library: liblumis_js_native.dylib
          - package: linux-arm64-gnu
            target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            library: liblumis_js_native.so
          - package: linux-x64-gnu
            target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            library: liblumis_js_native.so
          - package: win32-x64-msvc
            target: x86_64-pc-windows-msvc
            os: windows-latest
            library: lumis_js_native.dll
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build native runtime
        run: >-
          cargo build --locked --release
          --target ${{ matrix.target }}
          -p lumis-js-native

      - name: Stage native runtime
        shell: bash
        run: |
          mkdir native-artifact
          cp "target/${{ matrix.target }}/release/${{ matrix.library }}" \
            "native-artifact/lumis-native.${{ matrix.package }}.node"

      - uses: actions/upload-artifact@v4
        with:
          name: lumis-native-${{ matrix.package }}
          path: native-artifact/*.node
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build-native
    if: >-
      ${{
        !cancelled()
        && (
          needs.build-native.result == 'success'
          || needs.build-native.result == 'skipped'
        )
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
          registry-url: "https://registry.npmjs.org"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Determine package to publish
        id: pkg
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          tag="$RELEASE_TAG"
          component="${tag%%/v*}"
          set_output() {
            printf '%s=%s\n' "$1" "$2" >> "$GITHUB_OUTPUT"
          }

          if [ "$component" = "npm-themes" ]; then
            set_output filter "@lumis-sh/themes"
            set_output build_filters "@lumis-sh/themes"
          elif [ "$component" = "npm-lumis" ]; then
            set_output filter "@lumis-sh/lumis"
            set_output build_filters "@lumis-sh/themes @lumis-sh/lumis"
          elif [ "$component" = "npm-markdown-it-lumis" ]; then
            set_output filter "@lumis-sh/markdown-it-lumis"
            build_filters="@lumis-sh/themes @lumis-sh/lumis"
            build_filters="$build_filters @lumis-sh/markdown-it-lumis"
            set_output build_filters "$build_filters"
          elif [ "$component" = "npm-rehype-lumis" ]; then
            set_output filter "@lumis-sh/rehype-lumis"
            build_filters="@lumis-sh/themes @lumis-sh/lumis"
            build_filters="$build_filters @lumis-sh/rehype-lumis"
            set_output build_filters "$build_filters"
          elif [ "$component" = "npm-react" ]; then
            set_output filter "@lumis-sh/react"
            build_filters="@lumis-sh/themes @lumis-sh/lumis"
            build_filters="$build_filters @lumis-sh/react"
            set_output build_filters "$build_filters"
          elif [ "$component" = "npm-cli" ]; then
            set_output filter "@lumis-sh/cli"
            set_output build_filters ""
          elif [[ "$component" == npm-wasm-bundle-* ]]; then
            set_output filter "@lumis-sh/${component#npm-}"
            # Bundle packages contain generated, publish-ready entry points.
            set_output build_filters ""
          else
            echo "Unknown component: $component" && exit 1
          fi

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build publish target workspace packages
        if: steps.pkg.outputs.build_filters != ''
        env:
          BUILD_FILTERS: ${{ steps.pkg.outputs.build_filters }}
        run: |
          read -r -a packages <<< "$BUILD_FILTERS"
          for pkg in "${packages[@]}"; do
            pnpm --filter "$pkg" run build
          done

      - name: Download native runtimes
        if: steps.pkg.outputs.filter == '@lumis-sh/lumis'
        uses: actions/download-artifact@v4
        with:
          pattern: lumis-native-*
          path: native-artifacts
          merge-multiple: true

      - name: Stage native runtime packages
        if: steps.pkg.outputs.filter == '@lumis-sh/lumis'
        run: |
          for binary in native-artifacts/*.node; do
            filename="$(basename "$binary")"
            target="${filename#lumis-native.}"
            target="${target%.node}"
            cp "$binary" \
              "packages/javascript/lumis/native/npm/$target/$filename"
          done

      - name: Publish native runtime packages
        if: steps.pkg.outputs.filter == '@lumis-sh/lumis'
        run: |
          for package_dir in packages/javascript/lumis/native/npm/*; do
            npm publish "$package_dir" --access public --provenance
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish to npm
        run: >-
          pnpm --filter "$PACKAGE_FILTER" publish
          --access public --no-git-checks --provenance
        env:
          PACKAGE_FILTER: ${{ steps.pkg.outputs.filter }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
