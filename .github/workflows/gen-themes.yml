name: Generate Themes

on:
  schedule:
    - cron: "0 22 * * 0"
  workflow_dispatch:
  push:
    tags-ignore:
      - "**"
    paths:
      - ".github/workflows/gen-themes.yml"

jobs:
  gen-themes:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - uses: taiki-e/install-action@just

      - run: pnpm install --frozen-lockfile

      - name: Install Neovim
        run: |
          sudo add-apt-repository ppa:neovim-ppa/unstable -y
          sudo apt-get update
          sudo apt-get install -y lua5.4 neovim

      - name: themes-gen
        run: echo "y" | just themes-gen

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.CI_TOKEN }}
          add-paths: |
            themes
            crates/lumis-core/themes
            packages/javascript/themes/themes
          commit-message: "chore: generate themes"
          title: "chore: generate themes"
          body: |
            Automated PR to generate themes.

            This PR was created automatically by the gen-themes workflow.
          branch: gen-themes
          delete-branch: true
          base: main
