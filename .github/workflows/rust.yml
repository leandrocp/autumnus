name: Rust CI

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main ]
    paths:
      - ".cargo/config.toml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "crates/**"
      - "languages.toml"
      - "queries/**"
      - "mise.toml"
      - ".github/workflows/rust.yml"
  pull_request:
    paths:
      - ".cargo/config.toml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "crates/**"
      - "languages.toml"
      - "queries/**"
      - "mise.toml"
      - ".github/workflows/rust.yml"
  workflow_dispatch:

jobs:
  test-lumis:
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          (github.event_name == 'pull_request' && github.head_ref != 'knope/release') ||
          (github.event_name == 'push' && !startsWith(github.event.head_commit.message, 'chore: prepare releases')) }}
    uses: leandrocp/github-actions/.github/workflows/rust-test.yml@main
    with:
      msrv: '1.91'
      manifest-path: 'crates/lumis/Cargo.toml'
      test-stage: ${{ github.event_name == 'pull_request' && 'stable' || 'all' }}
      stable-os-versions: ${{ github.event_name == 'pull_request' && '["ubuntu-22.04"]' || '["ubuntu-22.04", "windows-2022", "macos-14"]' }}
  test-lumis-build:
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          (github.event_name == 'pull_request' && github.head_ref != 'knope/release') ||
          (github.event_name == 'push' && !startsWith(github.event.head_commit.message, 'chore: prepare releases')) }}
    uses: leandrocp/github-actions/.github/workflows/rust-test.yml@main
    with:
      msrv: '1.91'
      manifest-path: 'crates/lumis-build/Cargo.toml'
      test-stage: ${{ github.event_name == 'pull_request' && 'stable' || 'all' }}
      stable-os-versions: ${{ github.event_name == 'pull_request' && '["ubuntu-22.04"]' || '["ubuntu-22.04", "windows-2022", "macos-14"]' }}
  test-lumis-core:
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          (github.event_name == 'pull_request' && github.head_ref != 'knope/release') ||
          (github.event_name == 'push' && !startsWith(github.event.head_commit.message, 'chore: prepare releases')) }}
    uses: leandrocp/github-actions/.github/workflows/rust-test.yml@main
    with:
      msrv: '1.91'
      manifest-path: 'crates/lumis-core/Cargo.toml'
      test-stage: ${{ github.event_name == 'pull_request' && 'stable' || 'all' }}
      stable-os-versions: ${{ github.event_name == 'pull_request' && '["ubuntu-22.04"]' || '["ubuntu-22.04", "windows-2022", "macos-14"]' }}
  test-lumis-cli:
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          (github.event_name == 'pull_request' && github.head_ref != 'knope/release') ||
          (github.event_name == 'push' && !startsWith(github.event.head_commit.message, 'chore: prepare releases')) }}
    uses: leandrocp/github-actions/.github/workflows/rust-test.yml@main
    with:
      msrv: '1.91'
      manifest-path: 'crates/lumis-cli/Cargo.toml'
      test-stage: ${{ github.event_name == 'pull_request' && 'stable' || 'all' }}
      stable-os-versions: ${{ github.event_name == 'pull_request' && '["ubuntu-22.04"]' || '["ubuntu-22.04", "windows-2022", "macos-14"]' }}
  test-lumis-wasm-runtime:
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          (github.event_name == 'pull_request' && github.head_ref != 'knope/release') ||
          (github.event_name == 'push' && !startsWith(github.event.head_commit.message, 'chore: prepare releases')) }}
    uses: leandrocp/github-actions/.github/workflows/rust-test.yml@main
    with:
      msrv: '1.91'
      manifest-path: 'crates/lumis-wasm-runtime/Cargo.toml'
      test-stage: ${{ github.event_name == 'pull_request' && 'stable' || 'all' }}
      stable-os-versions: ${{ github.event_name == 'pull_request' && '["ubuntu-22.04"]' || '["ubuntu-22.04", "windows-2022", "macos-14"]' }}
  check-language-catalog:
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          (github.event_name == 'pull_request' && github.head_ref != 'knope/release') ||
          (github.event_name == 'push' && !startsWith(github.event.head_commit.message, 'chore: prepare releases')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: "crates/dev -> target"
          shared-key: language-catalog
      - run: >-
          cargo run --manifest-path crates/dev/Cargo.toml
          --locked --no-default-features -- gen-language-catalog --check
  test-packaged-parsers:
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          (github.event_name == 'pull_request' && github.head_ref != 'knope/release') ||
          (github.event_name == 'push' && !startsWith(github.event.head_commit.message, 'chore: prepare releases')) }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    env:
      MALLOC_CHECK_: "3"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Package Lumis
        run: cargo package -p lumis --no-verify

      - name: Test and audit the extracted package
        shell: bash
        run: |
          set -euo pipefail

          package_root="$RUNNER_TEMP/lumis-package"
          archive="$(find target/package -maxdepth 1 -name 'lumis-*.crate' -print -quit)"
          test -n "$archive"

          mkdir -p "$package_root"
          tar -xzf "$archive" -C "$package_root"
          package_dir="$(find "$package_root" -mindepth 1 -maxdepth 1 -type d -name 'lumis-*' -print -quit)"
          test -n "$package_dir"
          test ! -e "$package_dir/.cargo/config.toml"

          cp -R samples "$RUNNER_TEMP/samples"

          cd "$package_dir"
          export CARGO_TARGET_DIR="$RUNNER_TEMP/lumis-package-target"
          cargo test \
            --release \
            --no-default-features \
            --features all-languages \
            languages::tests::test_all_available_languages_have_samples_and_highlight \
            -- --exact --nocapture

          metadata="$RUNNER_TEMP/lumis-package-metadata.json"
          offenders="$RUNNER_TEMP/unsafe-tree-sitter-scanners.txt"
          cargo metadata \
            --format-version 1 \
            --all-features \
            >"$metadata"
          : >"$offenders"

          while IFS=$'\t' read -r package_name package_version package_manifest; do
            dependency_dir="${package_manifest%/Cargo.toml}"

            while IFS= read -r -d '' header; do
              if ! grep -Eq \
                '_array__grow\(\(Array[[:space:]]*\*\)\(self\)' \
                "$header"; then
                continue
              fi

              source_dir="${header%/tree_sitter/array.h}"
              scanners=()
              while IFS= read -r -d '' scanner; do
                if grep -Eq \
                  'array_(assign|extend|grow_by|insert|push|reserve|splice)[[:space:]]*\(' \
                  "$scanner"; then
                  scanners+=("${scanner#"$dependency_dir"/}")
                fi
              done < <(
                find "$source_dir" \
                  -maxdepth 1 \
                  -type f \
                  \( -name 'scanner.c' -o -name 'scanner.cc' -o -name 'scanner.cpp' \) \
                  -print0
              )

              if ((${#scanners[@]} > 0)); then
                scanner_list="$(IFS=', '; echo "${scanners[*]}")"
                printf '%s\t%s\t%s\t%s\n' \
                  "$package_name" \
                  "$package_version" \
                  "$scanner_list" \
                  "${header#"$dependency_dir"/}" \
                  >>"$offenders"
              fi
            done < <(
              find "$dependency_dir" \
                -type f \
                -path '*/tree_sitter/array.h' \
                -print0
            )
          done < <(
            jq -r '
              .packages[]
              | select(.source != null)
              | [.name, .version, .manifest_path]
              | @tsv
            ' "$metadata"
          )

          if [[ -s "$offenders" ]]; then
            echo "External Tree-sitter scanners still use an aliasing-unsafe array header:" >&2
            while IFS=$'\t' read -r package_name package_version scanners header; do
              printf '  - %s %s: %s -> %s\n' \
                "$package_name" \
                "$package_version" \
                "$scanners" \
                "$header" \
                >&2
            done <"$offenders"
            exit 1
          fi

          echo "All external Tree-sitter scanners use strict-aliasing-safe array headers."
  lint:
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          (github.event_name == 'pull_request' && github.head_ref != 'knope/release') ||
          (github.event_name == 'push' && !startsWith(github.event.head_commit.message, 'chore: prepare releases')) }}
    uses: leandrocp/github-actions/.github/workflows/rust-lint.yml@main
    with:
      msrv: '1.91'
      manifest-path: 'Cargo.toml'
