name: Rust CI

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main ]
    paths:
      - "crates/**"
      - "languages.toml"
      - "queries/**"
      - ".github/workflows/rust.yml"
  pull_request:
    paths:
      - "crates/**"
      - "languages.toml"
      - "queries/**"
      - ".github/workflows/rust.yml"
  workflow_dispatch:

jobs:
  test-lumis:
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          (github.event_name == 'pull_request' && github.head_ref != 'knope/release') ||
          (github.event_name == 'push' && !startsWith(github.event.head_commit.message, 'chore: prepare releases')) }}
    uses: leandrocp/github-actions/.github/workflows/rust-test.yml@main
    with:
      msrv: '1.91'
      manifest-path: 'crates/lumis/Cargo.toml'
  test-lumis-build:
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          (github.event_name == 'pull_request' && github.head_ref != 'knope/release') ||
          (github.event_name == 'push' && !startsWith(github.event.head_commit.message, 'chore: prepare releases')) }}
    uses: leandrocp/github-actions/.github/workflows/rust-test.yml@main
    with:
      msrv: '1.91'
      manifest-path: 'crates/lumis-build/Cargo.toml'
  test-lumis-core:
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          (github.event_name == 'pull_request' && github.head_ref != 'knope/release') ||
          (github.event_name == 'push' && !startsWith(github.event.head_commit.message, 'chore: prepare releases')) }}
    uses: leandrocp/github-actions/.github/workflows/rust-test.yml@main
    with:
      msrv: '1.91'
      manifest-path: 'crates/lumis-core/Cargo.toml'
  test-lumis-cli:
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          (github.event_name == 'pull_request' && github.head_ref != 'knope/release') ||
          (github.event_name == 'push' && !startsWith(github.event.head_commit.message, 'chore: prepare releases')) }}
    uses: leandrocp/github-actions/.github/workflows/rust-test.yml@main
    with:
      msrv: '1.91'
      manifest-path: 'crates/lumis-cli/Cargo.toml'
  test-lumis-wasm-runtime:
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          (github.event_name == 'pull_request' && github.head_ref != 'knope/release') ||
          (github.event_name == 'push' && !startsWith(github.event.head_commit.message, 'chore: prepare releases')) }}
    uses: leandrocp/github-actions/.github/workflows/rust-test.yml@main
    with:
      msrv: '1.91'
      manifest-path: 'crates/lumis-wasm-runtime/Cargo.toml'
  check-language-catalog:
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          (github.event_name == 'pull_request' && github.head_ref != 'knope/release') ||
          (github.event_name == 'push' && !startsWith(github.event.head_commit.message, 'chore: prepare releases')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.91'
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "crates/dev -> target"
          shared-key: language-catalog
      - run: >-
          cargo run --manifest-path crates/dev/Cargo.toml
          --locked --no-default-features -- gen-language-catalog --check
  lint:
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          (github.event_name == 'pull_request' && github.head_ref != 'knope/release') ||
          (github.event_name == 'push' && !startsWith(github.event.head_commit.message, 'chore: prepare releases')) }}
    uses: leandrocp/github-actions/.github/workflows/rust-lint.yml@main
    with:
      msrv: '1.91'
      manifest-path: 'Cargo.toml'
