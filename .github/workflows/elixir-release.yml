name: Elixir Release

on:
  push:
    tags:
      - "elixir@v*"
  workflow_dispatch:

env:
  LUMIS_BUILD: "1"

permissions:
  attestations: write
  contents: write
  id-token: write

jobs:
  nif-release:
    uses: leandrocp/github-actions/.github/workflows/nif-release.yml@main
    with:
      project-name: lumis_nif
      project-dir: packages/elixir/lumis/native/lumis_nif
      working-directory: packages/elixir/lumis

  hex-publish:
    name: Publish to Hex
    needs: nif-release
    if: startsWith(github.ref, 'refs/tags/elixir@v')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/elixir/lumis

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: erlef/setup-beam@v1
        with:
          otp-version: "28"
          elixir-version: "1.19"

      - name: Fetch dependencies
        run: mix deps.get

      - name: Generate checksums
        run: mix rustler_precompiled.download Lumis.Native --all --print

      - name: Publish to Hex
        run: mix hex.publish --yes
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
