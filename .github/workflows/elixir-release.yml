name: Elixir Release

on:
  push:
    tags:
      - "hex-lumis/v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (for example: hex-lumis/v0.3.0)"
        required: false
        type: string

env:
  LUMIS_BUILD: "1"

permissions:
  attestations: write
  contents: write
  id-token: write

jobs:
  nif-release:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
    uses: leandrocp/github-actions/.github/workflows/nif-release.yml@main
    with:
      project-name: lumis_nif
      project-dir: packages/elixir/lumis/native/lumis_nif
      working-directory: packages/elixir/lumis

  hex-publish:
    name: Publish to Hex
    needs: nif-release
    if: >-
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) &&
      startsWith(inputs.tag || github.ref_name, 'hex-lumis/v')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/elixir/lumis

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: erlef/setup-beam@v1
        with:
          otp-version: "28"
          elixir-version: "1.19"

      - name: Fetch dependencies
        run: mix deps.get

      - name: Generate checksums
        run: mix rustler_precompiled.download Lumis.Native --all --print

      - name: Publish to Hex
        run: mix hex.publish --yes
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
