[package]
name = "lumis-wasm-runtime"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
authors.workspace = true
description = "Internal Wasmtime-backed Tree-sitter runtime for Lumis"
publish = false

[dependencies]
lumis-core = { path = "../lumis-core", version = "2", default-features = false }
streaming-iterator = "0.1"
thiserror = "2"
tree-sitter = { version = "^0.26.9", features = ["wasm"] }
wasmtime = { version = "36", features = ["cache"] }
