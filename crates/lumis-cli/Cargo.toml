[package]
name = "lumis-cli"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
authors.workspace = true
description = "Syntax Highlighter CLI powered by Tree-sitter and Neovim themes"
keywords = ["lumis", "syntax-highlighter", "tree-sitter", "neovim", "cli"]
categories = ["command-line-utilities", "text-processing"]
include = ["/src/", "/themes/", "/build.rs", "/languages.toml", "/queries/", "/CHANGELOG.md", "/LICENSE"]

[[bin]]
name = "lumis"
path = "src/main.rs"
doc = false

[dependencies]
lumis-core = { path = "../lumis-core", version = ">=0.0.1", features = ["all-languages"] }
tree-sitter = { version = "^0.26", features = ["wasm"] }
wasmtime = { version = "36", features = ["cache"] }
streaming-iterator = "0.1"
thiserror = "2"
clap = { version = "4", features = ["derive", "env"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
etcetera = "0.11"
ureq = "3"
tempfile = "3"
terminal_size = "0.4"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"

[build-dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full", "parsing"] }
prettyplease = "0.2"
toml = "1.1"
serde = { version = "1", features = ["derive"] }
lumis-build = { path = "../lumis-build", version = "0.0.1" }
