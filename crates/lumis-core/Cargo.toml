[package]
name = "lumis-core"
version = "0.0.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
authors.workspace = true
description = "Lumis shared core"
keywords = ["lumis", "syntax-highlighter", "tree-sitter", "neovim"]
include = [
    "/src/",
    "/build.rs",
    "/languages.toml",
    "/themes/*.json",
    "/CHANGELOG.md",
    "/LICENSE",
]

[features]
default = ["all-languages"]

all-languages = [
    "lang-angular",
    "lang-asm",
    "lang-astro",
    "lang-bash",
