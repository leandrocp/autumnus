[dependencies]
derive_builder = "0.20"
glob = "0.3"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
v_htmlescape = "0.15"

[build-dependencies]
toml = "0.8"
serde = { version = "1", features = ["derive"] }
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full", "parsing"] }
prettyplease = "0.2"

[dev-dependencies]
pretty_assertions = "1"
