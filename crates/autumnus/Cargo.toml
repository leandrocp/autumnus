[workspace]

[package]
name = "autumnus"
version = "0.9.0"
edition = "2021"
rust-version = "1.91"
license = "MIT"
homepage = "https://lumis.sh"
repository = "https://github.com/leandrocp/lumis"
authors = ["Leandro Pereira <leandro@leandro.io>"]
description = "DEPRECATED - Use `lumis` instead. Syntax highlighter powered by Tree-sitter."
keywords = ["lumis", "syntax-highlighter", "tree-sitter", "neovim"]

[dependencies]
lumis = "0.1.0"

[lints.rust]
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
# This crate is its own workspace, so it cannot inherit the root's lint table.
# Keep the two in step; the reasoning behind each waiver lives in the root
# `Cargo.toml`.
implicit_hasher = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
needless_pass_by_value = "allow"
similar_names = "allow"
struct_excessive_bools = "allow"
too_many_lines = "allow"
cast_possible_truncation = "allow"
