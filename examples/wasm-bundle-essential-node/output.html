<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>wasm-bundle-essential-node + Lumis</title>
    <style>
      body { font-family: sans-serif; margin: 2rem; background: #f6f7f9; }
      main { max-width: 960px; margin: 0 auto; }
      pre.lumis { overflow-x: auto; }
    </style>
  </head>
  <body>
    <main>
      <h1>wasm-bundle-essential-node + Lumis</h1>
      <p>This example installs <code>@lumis-sh/wasm-bundle-essential</code> and imports only the Lumis language bundle.</p>
      <pre class="lumis" style="color: #1f2328; background-color: #ffffff;"><code class="language-toml" translate="no" tabindex="0"><div class="line" data-line="1"><span style="color: #57606a;"># lumis.config.toml</span>
</div><div class="line" data-line="2"><span style="color: #0550ae;">theme</span> <span style="color: #0550ae;">=</span> <span style="color: #0a3069;">&quot;github-light&quot;</span>
</div><div class="line" data-line="3">
</div><div class="line" data-line="4"><span style="color: #1f2328;">[</span><span style="color: #0550ae;">highlight</span><span style="color: #1f2328;">]</span>
</div><div class="line" data-line="5"><span style="color: #0550ae;">language</span> <span style="color: #0550ae;">=</span> <span style="color: #0a3069;">&quot;json&quot;</span>
</div><div class="line" data-line="6"><span style="color: #0550ae;">line_numbers</span> <span style="color: #0550ae;">=</span> <span style="color: #0550ae;">true</span>
</div><div class="line" data-line="7">
</div><div class="line" data-line="8"><span style="color: #1f2328;">[</span><span style="color: #0550ae;">render</span><span style="color: #1f2328;">]</span>
</div><div class="line" data-line="9"><span style="color: #0550ae;">format</span> <span style="color: #0550ae;">=</span> <span style="color: #0a3069;">&quot;html&quot;</span>
</div><div class="line" data-line="10"><span style="color: #0550ae;">inline_styles</span> <span style="color: #0550ae;">=</span> <span style="color: #0550ae;">true</span>
</div><div class="line" data-line="11">
</div></code></pre>
    </main>
  </body>
</html>
