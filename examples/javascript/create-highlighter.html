<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>createHighlighter</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
    pre.lumis { padding: 1rem; border-radius: 0.5rem; overflow-x: auto; }
  </style>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100 antialiased">
  <main class="mx-auto flex max-w-7xl flex-col gap-6 px-6 py-6 lg:px-8">
    <nav class="flex items-center justify-between rounded-2xl border border-cyan-400/20 bg-slate-950/70 px-4 py-3 shadow-[0_20px_50px_rgba(2,6,23,0.45)] backdrop-blur">
      <a class="text-sm font-medium text-slate-200 transition-colors hover:text-white" href="/">All examples</a>
      <span class="rounded-full border border-cyan-400/30 bg-cyan-400/10 px-3 py-1 text-[11px] uppercase tracking-[0.25em] text-cyan-300">Stateful API</span>
    </nav>
    <section class="rounded-[28px] border border-slate-800 bg-slate-950/70 p-6 shadow-[0_20px_50px_rgba(2,6,23,0.45)] backdrop-blur md:p-8">
      <p class="mb-3 text-[11px] uppercase tracking-[0.3em] text-cyan-300">Repeated rendering</p>
      <h1 class="text-2xl font-semibold text-white mb-2">createHighlighter</h1>
      <p class="text-slate-400 mb-6">Pre-load languages, then highlight synchronously.</p>
      <div id="output" class="space-y-4"></div>
    </section>
  </main>

  <script type="module">
    import { createHighlighter } from '../src/index.browser.ts'
    import { htmlInline } from '../src/formatters.ts'
    import javascript from '../langs/javascript.ts'
    import tokyonightMoon from '@lumis-sh/themes/tokyonight_moon'
    import dracula from '@lumis-sh/themes/dracula'

    const hl = await createHighlighter({
      languages: [javascript],
    })

    const code = `function fibonacci(n) {
  if (n <= 1) return n
  return fibonacci(n - 1) + fibonacci(n - 2)
}

console.log(fibonacci(10))`

    document.getElementById('output').innerHTML =
      hl.highlight(
        code,
        htmlInline({ language: javascript, theme: tokyonightMoon })
      ) +
      hl.highlight(
        code,
        htmlInline({ language: javascript, theme: dracula })
      )
  </script>
</body>
</html>
